
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer and explanation
        required: true
        default: "الإجابة الصحيحة"
      question_audio:
        description: Question audio
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio
        required: true
        default: "answer.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra blender
          python3 -m pip install --break-system-packages Pillow

      - name: Validate
        env:
          Q: ${{ inputs.question }}
          A: ${{ inputs.answer }}
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          test -s "$QA"
          test -s "$AA"
          test -n "$Q"
          test -n "$A"
          blender --version

      - name: Generate 3D Environment
        run: |
          cat > scene.py <<'PY'
          import bpy, math
          from mathutils import Vector

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          scene = bpy.context.scene
          scene.render.engine = 'BLENDER_EEVEE_NEXT'
          scene.render.resolution_x = 1080
          scene.render.resolution_y = 1920
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = 'PNG'
          scene.render.film_transparent = False

          world = bpy.data.worlds.new("PuzzleWorld")
          scene.world = world
          world.use_nodes = True
          world.node_tree.nodes["Background"].inputs["Color"].default_value = (0.008,0.015,0.045,1)
          world.node_tree.nodes["Background"].inputs["Strength"].default_value = 0.5

          def material(name, color, metallic=0, roughness=0.3, emission=0):
              m=bpy.data.materials.new(name)
              m.diffuse_color=(*color,1)
              m.use_nodes=True
              bs=m.node_tree.nodes.get("Principled BSDF")
              bs.inputs["Base Color"].default_value=(*color,1)
              bs.inputs["Metallic"].default_value=metallic
              bs.inputs["Roughness"].default_value=roughness
              bs.inputs["Emission Color"].default_value=(*color,1)
              bs.inputs["Emission Strength"].default_value=emission
              return m

          blue=material("Neon Blue",(0.015,0.12,0.45),0.8,0.25,0.5)
          cyan=material("Cyan",(0.02,0.5,0.8),0.6,0.2,2)
          gold=material("Gold",(0.8,0.4,0.03),0.8,0.2,1)
          dark=material("Dark Metal",(0.025,0.035,0.08),0.7,0.3)
          purple=material("Purple",(0.15,0.03,0.35),0.5,0.3,0.5)

          def cube(loc,scale,mat, bevel=0.15):
              bpy.ops.mesh.primitive_cube_add(size=1,location=loc)
              o=bpy.context.object
              o.dimensions=scale
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              o.data.materials.append(mat)
              if bevel:
                  mod=o.modifiers.new("Rounded edges","BEVEL")
                  mod.width=bevel
                  mod.segments=4
                  o.modifiers.new("Normals","WEIGHTED_NORMAL")
              return o

          def sphere(loc,scale,mat):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=32,ring_count=16,location=loc)
              o=bpy.context.object
              o.scale=scale
              o.data.materials.append(mat)
              bpy.ops.object.shade_smooth()
              return o

          def torus(loc,major,minor,mat,rotation=(0,0,0)):
              bpy.ops.mesh.primitive_torus_add(
                  major_radius=major,minor_radius=minor,
                  location=loc,rotation=rotation
              )
              o=bpy.context.object
              o.data.materials.append(mat)
              bpy.ops.object.shade_smooth()
              return o

          # Floor
          cube((0,0,-0.25),(30,30,0.5),dark,0.1)

          # Perspective floor lines
          for x in range(-12,13,2):
              cube((x,0,0.015),(0.025,24,0.02),blue,0.01)

          for y in range(-12,13,2):
              cube((0,y,0.02),(24,0.025,0.02),blue,0.01)

          # Floating 3D puzzle cubes
          positions=[
              (-4,3,4),(4,3,6),(-3,6,8),(3,7,3),
              (-5,1,9),(5,2,10),(-2,8,5),(2,9,8)
          ]

          for i,p in enumerate(positions):
              o=cube(p,(1.5,1.5,1.5),gold if i%3==0 else blue,0.22)
              o.rotation_euler=(0.3*i,0.2*i,0.4*i)

          # Large rings
          torus((0,5,7),3.2,0.12,cyan,(math.pi/2,0,0))
          torus((0,5,7),2.7,0.08,gold,(math.pi/2,0.3,0))
          torus((0,8,3),2.4,0.1,purple,(0.5,0.2,0))

          # Floating spheres
          sphere((-4,4,7),(0.8,0.8,0.8),cyan)
          sphere((4,5,4),(0.65,0.65,0.65),gold)
          sphere((0,9,9),(1,1,1),purple)

          # Platforms
          cube((0,5,1),(10,6,0.4),blue,0.2)
          cube((0,5,1.25),(8,4,0.15),gold,0.1)

          # Lighting
          def area_light(name,loc,power,color,size):
              bpy.ops.object.light_add(type='AREA',location=loc)
              l=bpy.context.object
              l.name=name
              l.data.energy=power
              l.data.color=color
              l.data.shape='DISK'
              l.data.size=size
              l.rotation_euler=(Vector((0,5,4))-l.location).to_track_quat('-Z','Y').to_euler()

          area_light("Blue Key",(-8,-6,12),1800,(0.1,0.3,1),8)
          area_light("Gold Rim",(8,5,12),2200,(1,0.55,0.1),7)
          area_light("Cyan Fill",(0,10,10),1500,(0.1,0.8,1),6)

          # Camera
          bpy.ops.object.camera_add(location=(0,-17,9))
          cam=bpy.context.object
          cam.rotation_euler=(Vector((0,5,5))-cam.location).to_track_quat('-Z','Y').to_euler()
          cam.data.lens=35
          scene.camera=cam

          scene.render.image_settings.color_mode='RGBA'
          scene.view_settings.view_transform='AgX'
          scene.render.filepath='/tmp/3d_background.png'

          bpy.ops.render.render(write_still=True)
          PY

          blender -b -t 2 --python scene.py

      - name: Generate Graphics
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          W, H = 1080, 1920

          FONT = subprocess.check_output(
              ["fc-match", "-f", "%{file}", "Noto Sans Arabic"],
              text=True
          ).strip()

          WHITE = (245, 250, 255)
          CYAN = (0, 230, 255)
          GOLD = (255, 200, 65)
          BG = (4, 8, 22)

          def font(size):
              return ImageFont.truetype(FONT, size)

          def measure(draw, text, ft):
              box = draw.textbbox(
                  (0, 0), text,
                  font=ft,
                  direction="rtl",
                  language="ar"
              )
              return box[2] - box[0]

          def draw_text(draw, xy, text, ft, color):
              draw.text(
                  xy,
                  str(text),
                  font=ft,
                  fill=color,
                  anchor="mm",
                  direction="rtl",
                  language="ar",
                  stroke_width=2,
                  stroke_fill=BG
              )

          # Transparent layer: the 3D Blender background
          # will be composited behind these graphics.
          def background():
              im = Image.new("RGBA", (W, H), (0,0,0,0))
              d = ImageDraw.Draw(im)

              d.rounded_rectangle(
                  (30, 30, 1050, 1890),
                  radius=55,
                  outline=(20, 80, 150, 220),
                  width=5
              )

              d.rounded_rectangle(
                  (50, 50, 1030, 1870),
                  radius=45,
                  outline=(0,230,255,180),
                  width=2
              )

              return im

          def panel(im, box, color):
              x1, y1, x2, y2 = box

              shadow = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              sd = ImageDraw.Draw(shadow)

              sd.rounded_rectangle(
                  (x1+15, y1+25, x2+15, y2+25),
                  radius=45,
                  fill=(0, 0, 0, 170)
              )

              shadow = shadow.filter(ImageFilter.GaussianBlur(35))
              im = Image.alpha_composite(im, shadow)

              layer = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              ld = ImageDraw.Draw(layer)

              ld.rounded_rectangle(
                  box,
                  radius=45,
                  fill=(10, 20, 48, 230),
                  outline=color,
                  width=5
              )

              ld.rounded_rectangle(
                  (x1+15, y1+15, x2-15, y2-15),
                  radius=35,
                  outline=(40, 80, 130, 180),
                  width=2
              )

              im = Image.alpha_composite(im, layer)

              edge = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              ed = ImageDraw.Draw(edge)

              ed.line(
                  (x1+80, y1+5, x2-80, y1+5),
                  fill=color,
                  width=5
              )

              edge = edge.filter(ImageFilter.GaussianBlur(20))
              im = Image.alpha_composite(im, edge)

              return im

          def centered(im, text, size, xy, color):
              d = ImageDraw.Draw(im)
              draw_text(d, xy, text, font(size), color)

          def wrap(text, ft, width):
              draw = ImageDraw.Draw(Image.new("RGB", (10, 10)))
              words = str(text).split()
              lines = []
              current = ""

              for word in words:
                  candidate = (current + " " + word).strip()

                  if measure(draw, candidate, ft) > width and current:
                      lines.append(current)
                      current = word
                  else:
                      current = candidate

              if current:
                  lines.append(current)

              return lines

          def paragraph(im, text, center_y, max_width):
              d = ImageDraw.Draw(im)
              selected = None

              for size in range(80, 38, -2):
                  ft = font(size)
                  lines = wrap(text, ft, max_width)

                  if len(lines) <= 7:
                      selected = (ft, lines)
                      break

              if selected is None:
                  ft = font(38)
                  selected = (ft, wrap(text, ft, max_width))

              ft, lines = selected
              line_h = ft.size + 45
              total = len(lines) * line_h
              y = center_y - total/2 + line_h/2

              for line in lines:
                  draw_text(d, (W//2, int(y)), line, ft, WHITE)
                  y += line_h

          def base_scene(label):
              im = background()
              im = panel(im, (140, 170, 940, 370), GOLD)
              centered(im, label, 60, (W//2, 270), GOLD)

              im = panel(im, (180, 1510, 900, 1650), CYAN)
              centered(im, "اختبر ذكاءك", 52, (W//2, 1580), GOLD)
              return im

          def create_intro():
              im = base_scene("تحدي الذكاء")
              im = panel(im, (100, 550, 980, 1350), CYAN)
              paragraph(im, os.environ["TITLE"], 950, 790)
              im.save("intro.png")

          def create_question():
              im = base_scene("لغز اليوم")
              im = panel(im, (100, 520, 980, 1390), CYAN)
              paragraph(im, os.environ["QUESTION"], 960, 800)
              im.save("question.png")

          def create_answer():
              im = base_scene("كشف الحل")
              im = panel(im, (100, 520, 980, 1390), GOLD)
              paragraph(im, os.environ["ANSWER"], 960, 800)
              im.save("answer.png")

          def create_outro():
              im = base_scene("شاركنا التحدي")
              im = panel(im, (100, 550, 980, 1350), GOLD)
              paragraph(im, "اكتب إجابتك في التعليقات", 950, 800)
              im.save("outro.png")

          def create_timer(n):
              im = base_scene("وقت التفكير")
              im = panel(im, (150, 570, 930, 1350), CYAN)
              d = ImageDraw.Draw(im)

              d.ellipse(
                  (220, 640, 860, 1280),
                  outline=(20, 55, 130),
                  width=35
              )

              d.ellipse(
                  (250, 670, 830, 1250),
                  outline=CYAN,
                  width=10
              )

              d.arc(
                  (250, 670, 830, 1250),
                  start=-90,
                  end=-90+(n/7)*360,
                  fill=GOLD,
                  width=22
              )

              centered(im, str(n), 340, (W//2, 960), WHITE)
              im.save(f"timer{n}.png")

          if not getattr(ImageFont.core, "HAVE_RAQM", False):
              raise RuntimeError("Pillow RAQM Arabic support unavailable")

          create_intro()
          create_question()
          create_answer()
          create_outro()

          for n in range(7, 0, -1):
              create_timer(n)
          PY

      - name: Render
        env:
          Q_AUDIO: ${{ inputs.question_audio }}
          A_AUDIO: ${{ inputs.answer_audio }}
        run: |
          mkdir -p segments

          qdur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$Q_AUDIO")
          adur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$A_AUDIO")

          render() {
            IMAGE="$1"
            DURATION="$2"
            AUDIO="$3"
            OUTPUT="$4"

            ffmpeg -nostdin -y \
              -loop 1 -i /tmp/3d_background.png \
              -loop 1 -i "$IMAGE" \
              ${AUDIO:+-i "$AUDIO"} \
              -t "$DURATION" \
              -filter_complex "[0:v]zoompan=z='min(zoom+0.0005,1.06)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=rgba[bg];[1:v]format=rgba[fg];[bg][fg]overlay=0:0:format=auto,format=yuv420p[v]" \
              -map "[v]" ${AUDIO:+-map 2:a} \
              -c:v libx264 -preset ultrafast -crf 22 \
              ${AUDIO:+-c:a aac -b:a 192k -ar 44100 -ac 2} \
              "$OUTPUT"
          }

          render intro.png 2 "" segments/00.mp4
          render question.png "$qdur" "$Q_AUDIO" segments/01.mp4

          i=2
          for n in 7 6 5 4 3 2 1; do
            render "timer${n}.png" 1 "" "segments/$(printf '%02d' $i).mp4"
            i=$((i+1))
          done

          render answer.png "$adur" "$A_AUDIO" segments/09.mp4
          render outro.png 3 "" segments/10.mp4

      - name: Merge
        run: |
          cat > concat.txt <<'EOF'
          file 'segments/00.mp4'
          file 'segments/01.mp4'
          file 'segments/02.mp4'
          file 'segments/03.mp4'
          file 'segments/04.mp4'
          file 'segments/05.mp4'
          file 'segments/06.mp4'
          file 'segments/07.mp4'
          file 'segments/08.mp4'
          file 'segments/09.mp4'
          file 'segments/10.mp4'
          EOF

          ffmpeg -nostdin -y \
            -f concat -safe 0 -i concat.txt \
            -c:v libx264 -preset ultrafast -crf 22 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart combined.mp4

          ffmpeg -nostdin -y \
            -i combined.mp4 -c copy \
            -movflags +faststart puzzle-video.mp4

      - name: Verify
        run: |
          ffprobe -v error \
            -select_streams a \
            -show_entries stream=codec_name,sample_rate \
            -of default=noprint_wrappers=1 \
            puzzle-video.mp4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          
