name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Video puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة هي ..."
      question_audio:
        description: Question audio file
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio file
        required: true
        default: "answer.wav"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg xvfb python3-pil fonts-dejavu-core fonts-noto-core libraqm-dev libfribidi-dev libharfbuzz-dev
          python3 -c "from PIL import ImageFont, features; print('RAQM:', features.check('raqm'))"

      - name: Validate audio
        env:
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          set -e
          test -f "$QA"
          test -f "$AA"
          ffprobe -v error "$QA"
          ffprobe -v error "$AA"

      - name: Build 3D Quiz Studio
        run: |
          cat > scene.py <<'PY'
          import bpy
          from mathutils import Vector

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          s=bpy.context.scene
          try:
              s.render.engine='BLENDER_EEVEE_NEXT'
          except:
              s.render.engine='BLENDER_EEVEE'

          s.render.resolution_x=720
          s.render.resolution_y=1280
          s.render.resolution_percentage=100
          s.render.image_settings.file_format='PNG'
          s.world.color=(.015,.015,.03)

          def mat(name,color,metal=0,rough=.35,emission=0):
              m=bpy.data.materials.new(name)
              m.diffuse_color=(*color,1)
              m.use_nodes=True
              b=m.node_tree.nodes.get('Principled BSDF')
              b.inputs['Base Color'].default_value=(*color,1)
              b.inputs['Metallic'].default_value=metal
              b.inputs['Roughness'].default_value=rough
              if emission:
                  b.inputs['Emission Color'].default_value=(*color,1)
                  b.inputs['Emission Strength'].default_value=emission
              return m

          navy=mat('Midnight',(.015,.025,.08),.4,.3)
          steel=mat('Steel',(.08,.14,.32),.6,.25)
          cyan=mat('Cyan',(.02,.55,1),.3,.2,2)
          gold=mat('Gold',(1,.55,.08),.65,.22,1)
          purple=mat('Purple',(.25,.08,.5),.45,.25)
          white=mat('White',(.8,.9,1),.2,.25,1)

          def cube(name,pos,scale,ma,bevel=.08):
              bpy.ops.object.mesh.primitive_cube_add(size=1,location=pos)
              o=bpy.context.object
              o.name=name
              o.dimensions=scale
              bpy.ops.object.transform_apply(
                  location=False,rotation=False,scale=True
              )
              o.data.materials.append(ma)
              if bevel:
                  b=o.modifiers.new('Edge finish','BEVEL')
                  b.width=bevel
                  b.segments=4
                  o.modifiers.new('Weighted normals','WEIGHTED_NORMAL')
              return o

          def sphere(name,pos,scale,ma):
              bpy.ops.object.mesh.primitive_uv_sphere_add(
                  segments=32,ring_count=20,location=pos
              )
              o=bpy.context.object
              o.name=name
              o.scale=scale
              o.data.materials.append(ma)
              bpy.ops.object.shade_smooth()
              return o

          def torus(name,pos,r,ma,rot=(0,0,0),minor=.055):
              bpy.ops.object.mesh.primitive_torus_add(
                  major_radius=r,minor_radius=minor,
                  location=pos,rotation=rot,
                  major_segments=64,minor_segments=12
              )
              o=bpy.context.object
              o.name=name
              o.data.materials.append(ma)
              bpy.ops.object.shade_smooth()
              return o

          # Floor and rear wall
          cube('Floor',(0,0,-1),(200,200,.2),navy)
          cube('Rear wall',(0,4,4),(18,.4,12),navy)

          # Architectural lighting panels
          for x in [-5,-3.8,3.8,5]:
              cube('Wall panel',(x,3.65,3.5),(.12,.15,7),steel,.04)
              sphere('Panel light',(x,3.5,6),(.12,.12,.12),cyan)

          # Central frame
          cube('Top frame',(0,2.8,7),(7,.35,.3),gold)
          cube('Left frame',(-3.5,2.8,4.2),(.3,.35,5.6),cyan)
          cube('Right frame',(3.5,2.8,4.2),(.3,.35,5.6),cyan)

          # Main podium
          bpy.ops.mesh.primitive_cylinder_add(
              vertices=96,radius=3.5,depth=.65,location=(0,0,-.45)
          )
          podium=bpy.context.object
          podium.name='Main stage'
          podium.data.materials.append(steel)
          b=podium.modifiers.new('Podium bevel','BEVEL')
          b.width=.15
          b.segments=4
          podium.modifiers.new('Normals','WEIGHTED_NORMAL')

          torus('Stage ring',(0,0,-.1),3.35,cyan)
          torus('Outer ring',(0,0,-.8),3.5,gold)

          # Pillars
          for x in [-3.8,3.8]:
              cube('Side pillar',(x,0,1),(.35,.35,3.8),steel)
              sphere('Pillar crown',(x,0,3),(.4,.4,.4),gold)
              torus('Pillar light',(x,0,1.8),.4,cyan)

          # Floating geometric decorations
          sphere('Blue orb',(-2.8,1.3,2),(.55,.55,.55),cyan)
          sphere('Gold orb',(2.8,1.4,2.1),(.4,.4,.4),gold)
          cube('Floating cube',(-2.7,-1.5,2),(.75,.75,.75),purple)
          torus('Floating ring',(2.5,-1.5,2),.7,gold,(.8,.2,.3))
          torus('Blue ring',(-2.5,-1.5,3),.65,cyan,(.4,.5,.2))

          # Camera
          bpy.ops.object.camera_add(location=(0,-13,6))
          cam=bpy.context.object
          cam.rotation_euler=(
              Vector((0,0,1.5))-cam.location
          ).to_track_quat('-Z','Y').to_euler()
          cam.data.lens=48
          s.camera=cam

          # Lighting
          def light(name,pos,power,color,size):
              bpy.ops.object.light_add(type='AREA',location=pos)
              l=bpy.context.object
              l.name=name
              l.data.energy=power
              l.data.color=color
              l.data.shape='DISK'
              l.data.size=size
              l.rotation_euler=(
                  Vector((0,0,0))-l.location
              ).to_track_quat('-Z','Y').to_euler()

          light('Key',(4,-5,8),1600,(.35,.6,1),6)
          light('Fill',(-5,-2,4),1200,(.2,.4,1),5)
          light('Rim',(0,4,6),2000,(1,.5,.15),4)
          light('Top',(0,0,9),1200,(1,1,1),5)
          light('Front',(0,-8,3),900,(.5,.7,1),4)

          s.render.filepath='/tmp/stage.png'
          bpy.ops.render.render(write_still=True)
          PY

          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python scene.py

      - name: Create Premium Graphics
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          cat > graphics.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont, features
          import os

          if not features.check("raqm"):
              raise RuntimeError("Pillow RAQM Arabic shaping unavailable")

          W,H=720,1280
          os.makedirs("graphics",exist_ok=True)
          FONT_PATH="/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf"
          LAYOUT=ImageFont.Layout.RAQM

          def font(size):
              return ImageFont.truetype(
                  FONT_PATH,size,layout_engine=LAYOUT
              )

          def measure(text,f):
              return f.getlength(text,direction="rtl",language="ar")

          def wrap(text,f,maxw):
              words=str(text).split()
              lines=[]
              current=""
              for word in words:
                  test=(current+" "+word).strip()
                  if measure(test,f)<=maxw:
                      current=test
                  else:
                      if current:
                          lines.append(current)
                      current=word
              if current:
                  lines.append(current)
              return lines

          def fit(text,maxw,maxh,start=64,minimum=28):
              for size in range(start,minimum-1,-2):
                  f=font(size)
                  lines=wrap(text,f,maxw)
                  lh=int(size*1.5)
                  if len(lines)*lh<=maxh:
                      return f,lines,lh
              f=font(minimum)
              lines=wrap(text,f,maxw)
              return f,lines,int(minimum*1.5)

          def draw_center(d,text,xy,f,fill,stroke=2):
              d.text(
                  xy,text,font=f,fill=fill,anchor="mm",
                  direction="rtl",language="ar",
                  stroke_width=stroke,
                  stroke_fill=(5,15,40,255)
              )

          def draw_lines(d,lines,f,lh,cy,fill):
              total=len(lines)*lh
              y=cy-total/2+lh/2
              for line in lines:
                  draw_center(
                      d,line,(360,y),f,fill,3
                  )
                  y+=lh

          def rounded(d,box,r,fill,outline,width=2):
              d.rounded_rectangle(
                  box,radius=r,fill=fill,
                  outline=outline,width=width
              )

          def base():
              im=Image.new("RGBA",(W,H),(0,0,0,0))
              d=ImageDraw.Draw(im)
              rounded(
                  d,(35,160,685,1120),42,
                  (5,14,38,218),(55,190,255,255),4
              )
              rounded(
                  d,(49,174,671,1106),35,
                  (12,27,65,190),(255,190,60,255),2
              )
              return im,d

          def header(d,text):
              rounded(
                  d,(85,210,635,340),30,
                  (20,55,135,245),(255,195,65,255),4
              )
              f,lines,lh=fit(text,450,90,52,30)
              draw_lines(d,lines,f,lh,275,(255,220,115,255))

          def question_box(d,text,box):
              rounded(
                  d,box,35,
                  (8,24,70,245),(60,180,255,255),4
              )
              x1,y1,x2,y2=box
              f,lines,lh=fit(
                  text,x2-x1-90,y2-y1-75,68,30
              )
              draw_lines(
                  d,lines,f,lh,(y1+y2)/2,
                  (255,255,255,255)
              )

          def footer(d,text):
              rounded(
                  d,(120,900,600,1015),28,
                  (15,40,100,245),(255,195,60,255),3
              )
              f,lines,lh=fit(text,400,75,34,22)
              draw_lines(
                  d,lines,f,lh,957,(255,220,115,255)
              )

          def save(im,name):
              im.save("graphics/"+name+".png")

          # Intro
          im,d=base()
          header(d,os.environ["TITLE"])
          question_box(d,"استعد للتحدي!",(100,440,620,760))
          footer(d,"اختبر قوة ذكائك")
          save(im,"intro")

          # Question
          im,d=base()
          header(d,"لغز اليوم")
          question_box(
              d,os.environ["QUESTION"],(75,390,645,830)
          )
          footer(d,"فكر قبل أن تجيب")
          save(im,"question")

          # Countdown
          for n in range(7,0,-1):
              im,d=base()
              header(d,"فكر جيدًا")
              question_box(
                  d,os.environ["QUESTION"],(75,370,645,700)
              )
              rounded(
                  d,(255,760,465,970),105,
                  (10,35,110,255),(255,195,60,255),8
              )
              draw_center(
                  d,str(n),(360,865),font(150),
                  (255,255,255,255),5
              )
              footer(d,"الوقت المتبقي")
              save(im,"timer"+str(n))

          # Pause
          im,d=base()
          header(d,"هل عرفت الحل؟")
          question_box(
              d,os.environ["QUESTION"],(75,390,645,830)
          )
          footer(d,"استعد لكشف الإجابة")
          save(im,"pause")

          # Answer
          im,d=base()
          header(d,"الحل الصحيح")
          question_box(
              d,os.environ["ANSWER"],(75,430,645,820)
          )
          footer(d,"هل كانت إجابتك صحيحة؟")
          save(im,"answer")

          # Outro
          im,d=base()
          header(d,"أحسنت التفكير!")
          question_box(
              d,"هل استطعت حل اللغز؟",(75,430,645,800)
          )
          footer(d,"تابع المزيد من الألغاز")
          save(im,"outro")

          print("Arabic graphics rendered using RAQM.")
          PY

          python3 graphics.py

      - name: Render Video and Assemble
        env:
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          set -e
          mkdir -p segments

          QD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$QA")
          AD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$AA")

          make_segment() {
            NAME="$1"
            OVER="$2"
            DUR="$3"
            AUD="$4"

            if [ "$AUD" = "silence" ]; then
              ffmpeg -y -loglevel error \
                -loop 1 -i /tmp/stage.png \
                -loop 1 -i "$OVER" \
                -f lavfi -i "anullsrc=r=44100:cl=stereo" \
                -filter_complex \
                "[0:v]scale=720:1280,zoompan=z='min(zoom+0.0004,1.08)':d=1:s=720x1280:fps=24,format=yuv420p[v0];[v0][1:v]overlay=0:0,format=yuv420p[v]" \
                -map "[v]" -map 2:a \
                -t "$DUR" -r 24 \
                -c:v libx264 -preset ultrafast -crf 23 \
                -c:a aac -b:a 128k -ar 44100 \
                -shortest "segments/$NAME.mp4"
            else
              ffmpeg -y -loglevel error \
                -loop 1 -i /tmp/stage.png \
                -loop 1 -i "$OVER" \
                -i "$AUD" \
                -filter_complex \
                "[0:v]scale=720:1280,zoompan=z='min(zoom+0.0004,1.08)':d=1:s=720x1280:fps=24,format=yuv420p[v0];[v0][1:v]overlay=0:0,format=yuv420p[v];[2:a]aresample=44100,aformat=channel_layouts=stereo[a]" \
                -map "[v]" -map "[a]" \
                -t "$DUR" -r 24 \
                -c:v libx264 -preset ultrafast -crf 23 \
                -c:a aac -b:a 128k -ar 44100 \
                "segments/$NAME.mp4"
            fi
          }

          # Intro
          make_segment intro graphics/intro.png 3 silence

          # Question
          make_segment question graphics/question.png "$QD" "$QA"

          # Countdown
          for N in 7 6 5 4 3 2 1; do
            make_segment "timer$N" "graphics/timer$N.png" 1 silence
          done

          # Pause
          make_segment pause graphics/pause.png 1.5 silence

          # Answer
          make_segment answer graphics/answer.png "$AD" "$AA"

          # Outro
          make_segment outro graphics/outro.png 3 silence

          # Assembly order
          cat > concat.txt <<'EOF'
          file 'segments/intro.mp4'
          file 'segments/question.mp4'
          file 'segments/timer7.mp4'
          file 'segments/timer6.mp4'
          file 'segments/timer5.mp4'
          file 'segments/timer4.mp4'
          file 'segments/timer3.mp4'
          file 'segments/timer2.mp4'
          file 'segments/timer1.mp4'
          file 'segments/pause.mp4'
          file 'segments/answer.mp4'
          file 'segments/outro.mp4'
          EOF

          ffmpeg -y -loglevel error \
            -f concat -safe 0 -i concat.txt \
            -c:v libx264 -preset ultrafast -crf 23 \
            -c:a aac -b:a 128k \
            -pix_fmt yuv420p -movflags +faststart \
            puzzle-video.mp4

          # Verification
          ffprobe -v error -show_entries stream=codec_type \
            -of csv=p=0 puzzle-video.mp4 > streams.txt

          grep -q video streams.txt
          grep -q audio streams.txt

          echo "Video and audio verified."

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          retention-days: 7
