
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer and explanation
        required: true
        default: "الإجابة الصحيحة"
      question_audio:
        description: Question audio file
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio file
        required: true
        default: "answer.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra libraqm-dev libfribidi-dev libharfbuzz-dev
          python3 -m pip install --break-system-packages Pillow

      - name: Check audio
        env:
          Q_AUDIO: ${{ inputs.question_audio }}
          A_AUDIO: ${{ inputs.answer_audio }}
        run: |
          test -s "$Q_AUDIO"
          test -s "$A_AUDIO"
          ffprobe -v error "$Q_AUDIO"
          ffprobe -v error "$A_AUDIO"

      - name: Generate graphics
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          python3 - <<'PY'
          import os, math
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1080, 1920
          FONT = "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf"

          CYAN = (0, 220, 255)
          BLUE = (50, 100, 255)
          GOLD = (255, 195, 55)
          WHITE = (255, 255, 255)
          PURPLE = (100, 45, 180)

          def font(size):
              return ImageFont.truetype(FONT, size)

          def background():
              im = Image.new("RGB", (W, H), (5, 8, 22))
              px = im.load()

              for y in range(H):
                  for x in range(W):
                      glow = max(0, 1-abs(x-W/2)/(W*.8))
                      v = max(0, 1-abs(y-H/2)/(H*.9))
                      px[x,y] = (
                          int(5+12*glow),
                          int(8+18*glow),
                          int(22+55*glow+20*v)
                      )

              d = ImageDraw.Draw(im)

              for r in range(180, 900, 120):
                  d.ellipse(
                      (W//2-r, H//2-r, W//2+r, H//2+r),
                      outline=(10, 25, 60), width=2
                  )

              d.rounded_rectangle(
                  (35,35,W-35,H-35),
                  radius=55, outline=(30,60,120), width=4
              )

              d.rounded_rectangle(
                  (55,55,W-55,H-55),
                  radius=45, outline=CYAN, width=3
              )

              return im

          def panel(draw, box, outline=CYAN):
              draw.rounded_rectangle(
                  box, radius=40,
                  fill=(12,20,48),
                  outline=outline, width=4
              )

          def draw_text_center(draw, text, fnt, center, color):
              draw.text(
                  center, text,
                  font=fnt, fill=color,
                  anchor="mm",
                  direction="rtl",
                  language="ar",
                  stroke_width=2,
                  stroke_fill=(5,8,22)
              )

          def wrap_text(text, fnt, max_width):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = (current+" "+word).strip()
                  box = fnt.getbbox(test, direction="rtl", language="ar")
                  width = box[2]-box[0]

                  if width > max_width and current:
                      lines.append(current)
                      current = word
                  else:
                      current = test

              if current:
                  lines.append(current)

              return lines

          def draw_paragraph(draw, text, center_y, max_width=840):
              chosen = None

              for size in range(82, 43, -4):
                  fnt = font(size)
                  lines = wrap_text(text, fnt, max_width)

                  if len(lines) <= 7:
                      chosen = (fnt, lines)
                      break

              if chosen is None:
                  chosen = (font(44), wrap_text(text, font(44), max_width))

              fnt, lines = chosen
              line_height = fnt.size+30
              total_height = len(lines)*line_height
              y = center_y-total_height/2+line_height/2

              for line in lines:
                  draw_text_center(draw, line, fnt, (W//2, int(y)), WHITE)
                  y += line_height

          def header(draw, label):
              panel(draw, (140,180,940,370), GOLD)
              draw_text_center(draw, label, font(58), (W//2,275), GOLD)

          def footer(draw):
              panel(draw, (180,1500,900,1640), CYAN)
              draw_text_center(
                  draw, "اختبر ذكاءك", font(52),
                  (W//2,1570), GOLD
              )

          def create(label, text, filename, number=None):
              im = background()
              d = ImageDraw.Draw(im)

              header(d, label)

              if number is not None:
                  d.ellipse(
                      (150,570,930,1350),
                      outline=(20,50,120), width=28
                  )
                  d.ellipse(
                      (220,640,860,1280),
                      outline=CYAN, width=10
                  )
                  draw_text_center(
                      d, str(number), font(360),
                      (W//2,960), WHITE
                  )
              else:
                  draw_paragraph(d, text, 960, 850)

              footer(d)
              im.save(filename)

          create("تحدي الذكاء",os.environ["TITLE"],"intro.png")
          create("لغز اليوم",os.environ["QUESTION"],"question.png")
          create("كشف الحل",os.environ["ANSWER"],"answer.png")
          create("شاركنا التحدي","اكتب إجابتك في التعليقات","outro.png")

          for n in range(7,0,-1):
              create("وقت التفكير","",f"timer{n}.png",n)

          PY

      - name: Render video segments
        env:
          Q_AUDIO: ${{ inputs.question_audio }}
          A_AUDIO: ${{ inputs.answer_audio }}
        run: |
          mkdir -p segments

          qdur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$Q_AUDIO")
          adur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$A_AUDIO")

          render_silent() {
            image="$1"
            duration="$2"
            output="$3"

            ffmpeg -nostdin -y \
              -loop 1 -i "$image" \
              -f lavfi -i anullsrc=r=44100:cl=stereo \
              -t "$duration" \
              -vf "zoompan=z='min(zoom+0.0005,1.05)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30" \
              -map 0:v -map 1:a \
              -c:v libx264 -preset ultrafast -crf 23 \
              -pix_fmt yuv420p -c:a aac -b:a 192k \
              -ar 44100 -ac 2 \
              "$output"
          }

          render_audio() {
            image="$1"
            audio="$2"
            duration="$3"
            output="$4"

            ffmpeg -nostdin -y \
              -loop 1 -i "$image" \
              -i "$audio" \
              -t "$duration" \
              -vf "zoompan=z='min(zoom+0.0005,1.05)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30" \
              -map 0:v -map 1:a \
              -c:v libx264 -preset ultrafast -crf 23 \
              -pix_fmt yuv420p -c:a aac -b:a 192k \
              -ar 44100 -ac 2 \
              "$output"
          }

          render_silent intro.png 2 segments/00.mp4

          render_audio question.png "$Q_AUDIO" "$qdur" segments/01.mp4

          i=2
          for n in 7 6 5 4 3 2 1; do
            render_silent "timer${n}.png" 1 "segments/$(printf '%02d' $i).mp4"
            i=$((i+1))
          done

          render_audio answer.png "$A_AUDIO" "$adur" segments/09.mp4

          render_silent outro.png 3 segments/10.mp4

      - name: Merge segments
        run: |
          cat > concat.txt <<'EOF'
          file 'segments/00.mp4'
          file 'segments/01.mp4'
          file 'segments/02.mp4'
          file 'segments/03.mp4'
          file 'segments/04.mp4'
          file 'segments/05.mp4'
          file 'segments/06.mp4'
          file 'segments/07.mp4'
          file 'segments/08.mp4'
          file 'segments/09.mp4'
          file 'segments/10.mp4'
          EOF

          ffmpeg -nostdin -y \
            -f concat -safe 0 -i concat.txt \
            -c:v libx264 -preset ultrafast -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 44100 -ac 2 \
            -movflags +faststart \
            combined.mp4

      - name: Final video
        run: |
          ffmpeg -nostdin -y \
            -i combined.mp4 \
            -c copy -movflags +faststart \
            puzzle-video.mp4

      - name: Verify final audio
        run: |
          ffprobe -v error \
            -select_streams a \
            -show_entries stream=codec_name,sample_rate \
            -of default=noprint_wrappers=1 \
            puzzle-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          
