
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة الصحيحة"
      audio_file:
        description: Audio file path
        required: true
        default: "audio.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Prepare text
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          python3 - <<'PY'
          import os

          for name, value in [
              ("title.txt", os.environ["TITLE"]),
              ("question.txt", os.environ["QUESTION"]),
              ("answer.txt", os.environ["ANSWER"]),
              ("footer.txt", "اكتب إجابتك في التعليقات"),
          ]:
              with open(name, "w", encoding="utf-8") as f:
                  f.write(value)

          for n in range(7, 0, -1):
              with open(f"t{n}.txt", "w", encoding="utf-8") as f:
                  f.write(str(n))
          PY

      - name: Check audio
        env:
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          test -f "$AUDIO_FILE"

      - name: Render video
        env:
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          FONT=/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf

          ffmpeg -y \
            -f lavfi -i "color=c=0x080D1A:s=1080x1920:r=30:d=30" \
            -i "$AUDIO_FILE" \
            -filter_complex "
            [0:v]
            drawbox=x=0:y=0:w=1080:h=1920:color=0x080D1A:t=fill,
            drawbox=x=60:y=260:w=960:h=1400:color=0x142447@0.8:t=fill,
            drawbox=x=60:y=260:w=960:h=1400:color=0xD4AF37:t=8,
            drawbox=x=80:y=280:w=920:h=1360:color=0x00D7FF@0.08:t=fill,
            drawtext=fontfile=${FONT}:textfile=title.txt:fontsize=70:fontcolor=0xD4AF37:x=(w-text_w)/2:y=400:enable='between(t,0,4)',
            drawtext=fontfile=${FONT}:textfile=question.txt:fontsize=60:fontcolor=white:x=(w-text_w)/2:y=700:enable='between(t,4,18)',
            drawtext=fontfile=${FONT}:textfile=t7.txt:fontsize=150:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1100:enable='between(t,18,19)',
            drawtext=fontfile=${FONT}:textfile=t6.txt:fontsize=150:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1100:enable='between(t,19,20)',
            drawtext=fontfile=${FONT}:textfile=t5.txt:fontsize=150:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1100:enable='between(t,20,21)',
            drawtext=fontfile=${FONT}:textfile=t4.txt:fontsize=150:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1100:enable='between(t,21,22)',
            drawtext=fontfile=${FONT}:textfile=t3.txt:fontsize=150:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1100:enable='between(t,22,23)',
            drawtext=fontfile=${FONT}:textfile=t2.txt:fontsize=150:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1100:enable='between(t,23,24)',
            drawtext=fontfile=${FONT}:textfile=t1.txt:fontsize=150:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1100:enable='between(t,24,25)',
            drawtext=fontfile=${FONT}:textfile=answer.txt:fontsize=65:fontcolor=0x00FF80:x=(w-text_w)/2:y=900:enable='between(t,25,29)',
            drawtext=fontfile=${FONT}:textfile=footer.txt:fontsize=42:fontcolor=white:x=(w-text_w)/2:y=1500:enable='between(t,29,30)'
            [v]
            " \
            -map "[v]" -map 1:a \
            -af "apad,atrim=0:30" \
            -t 30 \
            -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            puzzle-video.mp4

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          
