
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة الصحيحة"
      audio_file:
        description: Audio file path
        required: true
        default: "audio.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          python3 -m pip install --break-system-packages Pillow

      - name: Check audio
        env:
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          test -f "$AUDIO_FILE"

      - name: Generate scenes
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          python3 - <<'PY'
          import os, math
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1080, 1920
          FONT_PATH = "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf"
          GOLD = (255, 190, 40)
          BLUE = (0, 210, 255)
          WHITE = (255, 255, 255)

          def font(size):
              return ImageFont.truetype(FONT_PATH, size)

          def make_bg():
              im = Image.new("RGB", (W, H))
              p = im.load()
              for y in range(H):
                  for x in range(W):
                      glow = max(0, 1 - abs(x-W//2)/(W*0.8))
                      p[x,y] = (
                          int(5 + 10*glow),
                          int(12 + 22*glow),
                          int(30 + 50*glow)
                      )
              return im

          def wrap_ar(text, f, max_width):
              words = text.split()
              lines, line = [], ""
              for word in words:
                  test = (line + " " + word).strip()
                  box = f.getbbox(test, direction="rtl")
                  if box[2]-box[0] > max_width and line:
                      lines.append(line)
                      line = word
                  else:
                      line = test
              if line:
                  lines.append(line)
              return lines

          def draw_text_center(draw, text, f, y, color, max_width=850):
              lines = wrap_ar(text, f, max_width)
              line_h = f.size + 28
              total = len(lines)*line_h
              y = y-total//2
              for line in lines:
                  box = draw.textbbox((0,0), line, font=f, direction="rtl")
                  tw = box[2]-box[0]
                  draw.text(((W-tw)//2,y), line, font=f, fill=color,
                            direction="rtl", stroke_width=2,
                            stroke_fill=(8,15,35))
                  y += line_h

          def card(label, text, accent, filename, number=None):
              im = make_bg()
              d = ImageDraw.Draw(im)

              # Outer glowing frame
              for inset, col, width in [
                  (42, (20,45,95), 18),
                  (55, GOLD, 5),
                  (72, (0,95,170), 3)
              ]:
                  d.rounded_rectangle(
                      (inset,inset,W-inset,H-inset),
                      radius=48, outline=col, width=width
                  )

              # Decorative lights
              for i in range(12):
                  x = 100+i*80
                  d.ellipse((x,170,x+12,182), fill=accent)

              # Header
              d.rounded_rectangle((180,230,900,360), radius=50,
                                 fill=(10,30,75), outline=GOLD, width=5)
              draw_text_center(d,label,font(55),295,GOLD,680)

              if number is not None:
                  # Countdown ring
                  d.ellipse((170,620,910,1360),
                            outline=(15,80,160),width=28)
                  d.ellipse((220,670,860,1310),
                            outline=BLUE,width=12)
                  d.ellipse((280,730,800,1250),
                            outline=GOLD,width=5)
                  draw_text_center(d,str(number),font(300),990,BLUE,700)
              else:
                  draw_text_center(d,text,font(82),950,WHITE,850)

              # Footer glow
              d.rounded_rectangle((170,1480,910,1600),
                                 radius=40, fill=(10,35,85),
                                 outline=accent,width=5)
              draw_text_center(d,"اختبر ذكاءك",font(55),1540,GOLD,700)

              im.save(filename)

          card("التحدي يبدأ الآن", os.environ["TITLE"],
               GOLD, "intro.png")

          card("السؤال", os.environ["QUESTION"],
               BLUE, "question.png")

          for n in range(7,0,-1):
              card("لديك 7 ثوانٍ", "", BLUE,
                   f"timer{n}.png", number=n)

          card("الإجابة الصحيحة", os.environ["ANSWER"],
               GOLD, "answer.png")

          card("شارك إجابتك", "اكتب إجابتك في التعليقات",
               BLUE, "footer.png")

          # Video scene durations
          with open("scenes.txt","w") as f:
              f.write("intro.png 3\n")
              f.write("question.png 14\n")
              for n in range(7,0,-1):
                  f.write(f"timer{n}.png 1\n")
              f.write("answer.png 5\n")
              f.write("footer.png 1\n")
          PY

      - name: Render animated scenes
        run: |
          mkdir -p segments

          i=0
          while read image duration; do
            ffmpeg -y \
              -loop 1 -framerate 30 -i "$image" \
              -vf "zoompan=z='min(zoom+0.0005,1.06)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30" \
              -t "$duration" \
              -c:v libx264 -preset ultrafast -crf 23 \
              -pix_fmt yuv420p \
              "segments/$(printf '%02d' $i).mp4"
            i=$((i+1))
          done < scenes.txt

          for f in segments/*.mp4; do
            echo "file '$f'" >> concat.txt
          done

          ffmpeg -y -f concat -safe 0 -i concat.txt \
            -c copy silent-video.mp4

      - name: Add narration
        env:
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          ffmpeg -y \
            -i silent-video.mp4 \
            -i "$AUDIO_FILE" \
            -map 0:v -map 1:a \
            -af "apad" \
            -c:v copy -c:a aac -b:a 192k \
            -shortest \
            -movflags +faststart \
            puzzle-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          
