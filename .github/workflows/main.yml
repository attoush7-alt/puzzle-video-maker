
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer and explanation
        required: true
        default: "الإجابة الصحيحة"
      question_audio:
        description: Question audio file
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio file
        required: true
        default: "answer.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          python3 -m pip install --break-system-packages Pillow arabic-reshaper python-bidi

      - name: Check audio
        env:
          Q_AUDIO: ${{ inputs.question_audio }}
          A_AUDIO: ${{ inputs.answer_audio }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          test -s "$Q_AUDIO"
          test -s "$A_AUDIO"
          test -n "$QUESTION"
          test -n "$ANSWER"
          ffprobe -v error "$Q_AUDIO"
          ffprobe -v error "$A_AUDIO"

      - name: Generate graphics
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          python3 - <<'PY'
          import os, subprocess, math
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display

          W, H = 1080, 1920

          FONT = subprocess.check_output(
              ["fc-match", "-f", "%{file}", "Noto Sans Arabic"],
              text=True
          ).strip()

          CYAN = (0, 225, 255)
          BLUE = (35, 90, 255)
          GOLD = (255, 200, 60)
          WHITE = (255, 255, 255)
          PURPLE = (105, 50, 190)
          BG = (5, 8, 22)

          def f(size):
              return ImageFont.truetype(FONT, size)

          def ar(text):
              return get_display(
                  arabic_reshaper.reshape(str(text))
              )

          def background():
              im = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(im)

              for r in range(160, 950, 130):
                  d.ellipse(
                      (W//2-r, H//2-r, W//2+r, H//2+r),
                      outline=(12, 24, 55), width=2
                  )

              d.rounded_rectangle(
                  (35,35,W-35,H-35),
                  radius=55,
                  outline=(30,60,120),
                  width=4
              )

              d.rounded_rectangle(
                  (55,55,W-55,H-55),
                  radius=45,
                  outline=CYAN,
                  width=3
              )

              d.line((100,440,980,440), fill=(20,45,100), width=3)
              d.line((100,1450,980,1450), fill=(20,45,100), width=3)

              return im

          def panel(d, box, outline=CYAN, fill=(12,20,48)):
              d.rounded_rectangle(
                  box, radius=42,
                  fill=fill, outline=outline, width=4
              )

          def centered(d, text, fnt, xy, color):
              d.text(
                  xy, ar(text), font=fnt,
                  fill=color, anchor="mm",
                  stroke_width=2,
                  stroke_fill=(4,8,20)
              )

          def wrap(text, fnt, max_width):
              words = str(text).split()
              lines = []
              current = ""

              for word in words:
                  test = (current+" "+word).strip()
                  shown = ar(test)
                  box = fnt.getbbox(shown)
                  width = box[2]-box[0]

                  if width > max_width and current:
                      lines.append(current)
                      current = word
                  else:
                      current = test

              if current:
                  lines.append(current)

              return lines

          def paragraph(d, text, center_y, max_width=820):
              chosen = None

              for size in range(82, 39, -4):
                  fnt = f(size)
                  lines = wrap(text, fnt, max_width)

                  if len(lines) <= 8:
                      chosen = (fnt, lines)
                      break

              if chosen is None:
                  fnt = f(40)
                  chosen = (fnt, wrap(text, fnt, max_width))

              fnt, lines = chosen
              line_height = fnt.size + 32
              total = len(lines)*line_height
              y = center_y-total/2+line_height/2

              for line in lines:
                  centered(d, line, fnt, (W//2,int(y)), WHITE)
                  y += line_height

          def header(d, label):
              panel(d,(145,180,935,365),GOLD,(12,25,60))
              centered(d,label,f(58),(W//2,270),GOLD)

          def footer(d):
              panel(d,(180,1500,900,1640),CYAN,(10,28,65))
              centered(d,"اختبر ذكاءك",f(52),(W//2,1570),GOLD)

          def create(label,text,filename,number=None):
              im = background()
              d = ImageDraw.Draw(im)

              header(d,label)

              if number is not None:
                  d.ellipse(
                      (150,570,930,1350),
                      outline=(20,50,120),width=26
                  )
                  d.ellipse(
                      (220,640,860,1280),
                      outline=CYAN,width=10
                  )
                  centered(d,str(number),f(350),(W//2,960),WHITE)
              else:
                  panel(d,(100,520,980,1390),CYAN,(10,18,45))
                  paragraph(d,text,960,800)

              footer(d)
              im.save(filename)

          title = os.environ["TITLE"]
          question = os.environ["QUESTION"]
          answer = os.environ["ANSWER"]

          if not question.strip():
              raise ValueError("نص السؤال فارغ")
          if not answer.strip():
              raise ValueError("نص الإجابة فارغ")

          create("تحدي الذكاء",title,"intro.png")
          create("لغز اليوم",question,"question.png")
          create("كشف الحل",answer,"answer.png")
          create("شاركنا التحدي","اكتب إجابتك في التعليقات","outro.png")

          for n in range(7,0,-1):
              create("وقت التفكير","",f"timer{n}.png",n)

          PY

      - name: Render video segments
        env:
          Q_AUDIO: ${{ inputs.question_audio }}
          A_AUDIO: ${{ inputs.answer_audio }}
        run: |
          mkdir -p segments

          qdur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$Q_AUDIO")
          adur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$A_AUDIO")

          render_silent() {
            image="$1"
            duration="$2"
            output="$3"

            ffmpeg -nostdin -y \
              -loop 1 -i "$image" \
              -f lavfi -i anullsrc=r=44100:cl=stereo \
              -t "$duration" \
              -vf "zoompan=z='min(zoom+0.0005,1.05)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30" \
              -map 0:v -map 1:a \
              -c:v libx264 -preset ultrafast -crf 23 \
              -pix_fmt yuv420p -c:a aac -b:a 192k \
              -ar 44100 -ac 2 \
              "$output"
          }

          render_audio() {
            image="$1"
            audio="$2"
            duration="$3"
            output="$4"

            ffmpeg -nostdin -y \
              -loop 1 -i "$image" \
              -i "$audio" \
              -t "$duration" \
              -vf "zoompan=z='min(zoom+0.0005,1.05)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30" \
              -map 0:v -map 1:a \
              -c:v libx264 -preset ultrafast -crf 23 \
              -pix_fmt yuv420p -c:a aac -b:a 192k \
              -ar 44100 -ac 2 \
              "$output"
          }

          render_silent intro.png 2 segments/00.mp4

          render_audio question.png "$Q_AUDIO" "$qdur" segments/01.mp4

          i=2
          for n in 7 6 5 4 3 2 1; do
            render_silent "timer${n}.png" 1 "segments/$(printf '%02d' $i).mp4"
            i=$((i+1))
          done

          render_audio answer.png "$A_AUDIO" "$adur" segments/09.mp4

          render_silent outro.png 3 segments/10.mp4

      - name: Merge segments
        run: |
          cat > concat.txt <<'EOF'
          file 'segments/00.mp4'
          file 'segments/01.mp4'
          file 'segments/02.mp4'
          file 'segments/03.mp4'
          file 'segments/04.mp4'
          file 'segments/05.mp4'
          file 'segments/06.mp4'
          file 'segments/07.mp4'
          file 'segments/08.mp4'
          file 'segments/09.mp4'
          file 'segments/10.mp4'
          EOF

          ffmpeg -nostdin -y \
            -f concat -safe 0 -i concat.txt \
            -c:v libx264 -preset ultrafast -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 192k -ar 44100 -ac 2 \
            -movflags +faststart \
            combined.mp4

      - name: Final video
        run: |
          ffmpeg -nostdin -y \
            -i combined.mp4 \
            -c copy -movflags +faststart \
            puzzle-video.mp4

      - name: Verify final audio
        run: |
          ffprobe -v error \
            -select_streams a \
            -show_entries stream=codec_name,sample_rate \
            -of default=noprint_wrappers=1 \
            puzzle-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          
