
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة الصحيحة"
      audio_file:
        description: Audio file path
        required: true
        default: "audio.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Prepare text files
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          python3 - <<'PY'
          import os

          files = {
              "title.txt": os.environ["TITLE"],
              "question.txt": os.environ["QUESTION"],
              "answer.txt": os.environ["ANSWER"],
              "footer.txt": "شارك إجابتك في التعليقات",
          }

          for name, text in files.items():
              with open(name, "w", encoding="utf-8") as f:
                  f.write(text)

          for n in range(1, 8):
              with open(f"timer{n}.txt", "w", encoding="utf-8") as f:
                  f.write(str(n))
          PY

      - name: Check audio
        env:
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          test -f "$AUDIO_FILE" || exit 1

      - name: Create video
        env:
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          FONT="/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf"

          FILTER="drawbox=x=0:y=0:w=1080:h=1920:color=0x101B35:t=fill"
          FILTER="$FILTER,drawbox=x=40:y=250:w=1000:h=1420:color=0xD4AF37:t=8"

          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=title.txt:fontsize=75:fontcolor=0xD4AF37:x=(w-text_w)/2:y=220:enable='between(t,0,4)'"

          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=question.txt:fontsize=65:fontcolor=white:x=(w-text_w)/2:y=650:enable='between(t,4,18)'"

          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=timer7.txt:fontsize=160:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1000:enable='between(t,18,19)'"
          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=timer6.txt:fontsize=160:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1000:enable='between(t,19,20)'"
          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=timer5.txt:fontsize=160:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1000:enable='between(t,20,21)'"
          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=timer4.txt:fontsize=160:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1000:enable='between(t,21,22)'"
          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=timer3.txt:fontsize=160:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1000:enable='between(t,22,23)'"
          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=timer2.txt:fontsize=160:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1000:enable='between(t,23,24)'"
          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=timer1.txt:fontsize=160:fontcolor=0x00D7FF:x=(w-text_w)/2:y=1000:enable='between(t,24,25)'"

          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=answer.txt:fontsize=70:fontcolor=0x00FF80:x=(w-text_w)/2:y=850:enable='between(t,25,29)'"

          FILTER="$FILTER,drawtext=fontfile=$FONT:textfile=footer.txt:fontsize=45:fontcolor=white:x=(w-text_w)/2:y=1550:enable='between(t,29,30)'"

          ffmpeg -y \
            -f lavfi -i "color=c=0x080D1A:s=1080x1920:r=30:d=30" \
            -i "$AUDIO_FILE" \
            -vf "$FILTER" \
            -af "apad,atrim=0:30" \
            -t 30 \
            -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            puzzle-video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          
