name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Video puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة هي ..."
      question_audio:
        description: Question audio
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio
        required: true
        default: "answer.wav"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core python3-pil

      - name: Validate audio
        env:
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          test -f "$QA"
          test -f "$AA"

      - name: Render 3D background
        run: |
          cat > scene.py <<'PY'
          import bpy, math
          from mathutils import Vector

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          s=bpy.context.scene
          s.render.engine='BLENDER_EEVEE'
          s.render.resolution_x=720
          s.render.resolution_y=1280
          s.render.resolution_percentage=100
          s.render.image_settings.file_format='PNG'

          def material(n,c,metal=0,rough=.3,emit=0):
              m=bpy.data.materials.new(n)
              m.diffuse_color=(*c,1)
              m.use_nodes=True
              b=m.node_tree.nodes.get('Principled BSDF')
              b.inputs['Base Color'].default_value=(*c,1)
              b.inputs['Metallic'].default_value=metal
              b.inputs['Roughness'].default_value=rough
              if emit:
                  b.inputs['Emission Color'].default_value=(*c,1)
                  b.inputs['Emission Strength'].default_value=emit
              return m

          blue=material('Blue',(.02,.12,.5),.5)
          dark=material('Dark',(.015,.02,.06))
          gold=material('Gold',(1,.55,.08),.6)
          cyan=material('Cyan',(.02,.65,1),.4,.2,2)
          purple=material('Purple',(.35,.08,.65),.4)

          def cube(n,p,sc,ma):
              bpy.ops.mesh.primitive_cube_add(size=1,location=p)
              o=bpy.context.object
              o.name=n
              o.dimensions=sc
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              o.data.materials.append(ma)
              b=o.modifiers.new('Rounded','BEVEL')
              b.width=.12
              b.segments=3
              o.modifiers.new('Normals','WEIGHTED_NORMAL')
              return o

          def sphere(n,p,sc,ma):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=32,ring_count=16,location=p)
              o=bpy.context.object
              o.name=n
              o.scale=sc
              o.data.materials.append(ma)
              bpy.ops.object.shade_smooth()
              return o

          def ring(n,p,r,ma):
              bpy.ops.mesh.primitive_torus_add(
                  major_radius=r,minor_radius=.07,location=p)
              o=bpy.context.object
              o.name=n
              o.data.materials.append(ma)
              bpy.ops.object.shade_smooth()
              return o

          cube('Floor',(0,0,-1),(200,200,.2),dark)

          bpy.ops.mesh.primitive_cylinder_add(
              vertices=96,radius=4,depth=.5,location=(0,0,-.5))
          o=bpy.context.object
          o.data.materials.append(blue)
          b=o.modifiers.new('Bevel','BEVEL')
          b.width=.12
          b.segments=3
          o.modifiers.new('Normals','WEIGHTED_NORMAL')

          ring('Neon',(0,0,-.15),3.8,cyan)
          ring('Gold',(0,0,-.75),4.1,gold)

          sphere('Orb',(-3,1,1),(.5,.5,.5),cyan)
          sphere('Orb2',(3,1,1),(.4,.4,.4),gold)
          cube('Cube',(-2,-2,1),(.8,.8,.8),purple)
          ring('Floating ring',(2,-1,1),.7,gold)

          for x in [-3.5,3.5]:
              cube('Column',(x,0,.4),(.15,.15,3),cyan)

          bpy.ops.object.camera_add(location=(0,-13,6))
          cam=bpy.context.object
          cam.rotation_euler=(Vector((0,0,.3))-cam.location).to_track_quat('-Z','Y').to_euler()
          s.camera=cam

          def light(n,p,power,col,size):
              bpy.ops.object.light_add(type='AREA',location=p)
              l=bpy.context.object
              l.name=n
              l.data.energy=power
              l.data.color=col
              l.data.shape='DISK'
              l.data.size=size
              l.rotation_euler=(Vector((0,0,0))-l.location).to_track_quat('-Z','Y').to_euler()

          light('Key',(4,-5,8),1500,(.4,.65,1),6)
          light('Fill',(-5,-2,4),1200,(.2,.4,1),5)
          light('Rim',(0,4,6),1800,(1,.5,.15),4)

          s.render.filepath='/tmp/stage.png'
          bpy.ops.render.render(write_still=True)
          PY

          LIBGL_ALWAYS_SOFTWARE=1 \
          xvfb-run -a blender -b -t 2 --python scene.py

      - name: Create overlays
        env:
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          cat > graphics.py <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          import os

          W,H=720,1280
          os.makedirs('graphics',exist_ok=True)
          f='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'

          def make(n,h,b='',small='',num=None):
              im=Image.new('RGBA',(W,H),(0,0,0,0))
              d=ImageDraw.Draw(im)
              d.rounded_rectangle((35,220,685,1060),radius=45,
                fill=(5,12,35,230),outline=(30,180,255,255),width=5)
              d.rounded_rectangle((90,275,630,370),radius=25,
                fill=(15,60,150,240),outline=(255,190,50,255),width=3)
              d.text((360,322),h,font=ImageFont.truetype(f,42),
                fill=(255,220,100),anchor='mm',direction='rtl')
              if b:
                  d.text((360,560),b,font=ImageFont.truetype(f,58),
                    fill='white',anchor='mm',align='center',
                    direction='rtl',spacing=15)
              if num is not None:
                  d.ellipse((220,720,500,1000),fill=(10,40,120,240),
                    outline=(255,190,50),width=10)
                  d.text((360,860),str(num),font=ImageFont.truetype(f,160),
                    fill='white',anchor='mm')
              if small:
                  d.text((360,945),small,font=ImageFont.truetype(f,34),
                    fill=(80,230,255),anchor='mm',direction='rtl')
              im.save('graphics/'+n+'.png')

          make('intro','اختبر ذكاءك','استعد للتحدي')
          make('question','لغز اليوم',os.environ['QUESTION'],'فكر قبل أن تجيب')
          make('pause','فكر جيدًا',os.environ['QUESTION'])
          make('answer','الإجابة الصحيحة',os.environ['ANSWER'],'هل عرفت الحل؟')
          make('outro','أحسنت التفكير','تابع المزيد من الألغاز')

          for n in range(7,0,-1):
              make('timer'+str(n),'فكر جيدًا',
                os.environ['QUESTION'],'الوقت المتبقي',n)
          PY

          python3 graphics.py

      - name: Create video
        env:
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          set -e
          mkdir -p segments

          QD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$QA")
          AD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$AA")

          make_segment() {
            NAME="$1"
            OVER="$2"
            DUR="$3"
            AUD="$4"

            if [ "$AUD" = "silence" ]; then
              ffmpeg -y -loglevel error \
                -loop 1 -i /tmp/stage.png \
                -loop 1 -i "$OVER" \
                -f lavfi -i "anullsrc=r=44100:cl=stereo" \
                -t "$DUR" \
                -filter_complex \
                "[0:v]scale=720:1280[v0];[v0][1:v]overlay=0:0,format=yuv420p[v]" \
                -map "[v]" -map 2:a \
                -r 24 -c:v libx264 -preset ultrafast -crf 24 \
                -c:a aac -b:a 128k -ar 44100 \
                -shortest "segments/$NAME.mp4"
            else
              ffmpeg -y -loglevel error \
                -loop 1 -i /tmp/stage.png \
                -loop 1 -i "$OVER" \
                -i "$AUD" \
                -filter_complex \
                "[0:v]scale=720:1280[v0];[v0][1:v]overlay=0:0,format=yuv420p[v];[2:a]aresample=44100,aformat=channel_layouts=stereo[a]" \
                -map "[v]" -map "[a]" \
                -r 24 -c:v libx264 -preset ultrafast -crf 24 \
                -c:a aac -b:a 128k -ar 44100 \
                -t "$DUR" "segments/$NAME.mp4"
            fi
          }

          # 1: Intro
          make_segment intro graphics/intro.png 3 silence

          # 2: Question and question audio
          make_segment question graphics/question.png "$QD" "$QA"

          # 3: Countdown 7 to 1
          for N in 7 6 5 4 3 2 1; do
            make_segment "timer$N" "graphics/timer$N.png" 1 silence
          done

          # 4: Thinking pause
          make_segment pause graphics/pause.png 1.5 silence

          # 5: Answer and answer audio
          make_segment answer graphics/answer.png "$AD" "$AA"

          # 6: Outro
          make_segment outro graphics/outro.png 3 silence

          # Fixed sequence. Never use alphabetical order.
          cat > concat.txt <<'EOF'
          file 'segments/intro.mp4'
          file 'segments/question.mp4'
          file 'segments/timer7.mp4'
          file 'segments/timer6.mp4'
          file 'segments/timer5.mp4'
          file 'segments/timer4.mp4'
          file 'segments/timer3.mp4'
          file 'segments/timer2.mp4'
          file 'segments/timer1.mp4'
          file 'segments/pause.mp4'
          file 'segments/answer.mp4'
          file 'segments/outro.mp4'
          EOF

          ffmpeg -y -loglevel error \
            -f concat -safe 0 -i concat.txt \
            -c:v libx264 -preset ultrafast -crf 23 \
            -c:a aac -b:a 128k \
            -pix_fmt yuv420p -movflags +faststart \
            puzzle-video.mp4

          # Verify final streams
          ffprobe -v error -show_entries stream=codec_type \
            -of csv=p=0 puzzle-video.mp4 > streams.txt

          grep -q video streams.txt
          grep -q audio streams.txt

          echo "Video and audio verified."

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          retention-days: 7
