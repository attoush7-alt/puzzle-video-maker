
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة الصحيحة"
      audio_file:
        description: Audio file path
        required: true
        default: "audio.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Check audio file
        env:
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          test -f "$AUDIO_FILE" || {
            echo "Audio file not found"
            exit 1
          }

      - name: Create professional video
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
          AUDIO_FILE: ${{ inputs.audio_file }}
        run: |
          python3 - <<'PY'
          import os

          title = os.environ["TITLE"]
          question = os.environ["QUESTION"]
          answer = os.environ["ANSWER"]

          def esc(s):
              return s.replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}")

          with open("puzzle.ass", "w", encoding="utf-8") as f:
              f.write("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Title,Noto Sans,72,&H0000D7FF,&H000000FF,&H00101830,&H90000000,1,0,0,0,100,100,0,0,1,5,3,8,70,70,100,1
          Style: Question,Noto Sans,68,&H00FFFFFF,&H000000FF,&H00101830,&H90000000,1,0,0,0,100,100,0,0,1,5,3,5,100,100,100,1
          Style: Timer,Noto Sans,110,&H0000D7FF,&H000000FF,&H00101830,&H90000000,1,0,0,0,100,100,0,0,1,6,4,5,60,60,100,1
          Style: Answer,Noto Sans,78,&H0000FF80,&H000000FF,&H00101830,&H90000000,1,0,0,0,100,100,0,0,1,6,4,5,80,80,100,1
          Style: Footer,Noto Sans,42,&H00FFFFFF,&H000000FF,&H00101830,&H90000000,1,0,0,0,100,100,0,0,1,3,2,2,60,60,100,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """)

              f.write("Dialogue: 0,0:00:00.00,0:00:03.50,Title,,0,0,0,,{\\fad(500,500)}" + esc(title) + "\\n")
              f.write("Dialogue: 0,0:00:04.00,0:00:18.00,Question,,0,0,0,,{\\fad(600,400)}" + esc(question) + "\\n")

              for n in range(7, 0, -1):
                  start = 18 + (7 - n)
                  end = start + 1
                  f.write(
                      f"Dialogue: 1,0:00:{start:02d}.00,0:00:{end:02d}.00,Timer,,0,0,0,,"
                      + f"{{\\fad(150,150)\\t(0,800,\\fscx120\\fscy120)}}{n}\\n"
                  )

              f.write("Dialogue: 0,0:00:25.00,0:00:29.00,Answer,,0,0,0,,{\\fad(500,500)}" + esc(answer) + "\\n")
              f.write("Dialogue: 0,0:00:29.00,0:00:30.00,Footer,,0,0,0,,{\\fad(300,300)} شارك إجابتك في التعليقات\\n")
          PY

          ffmpeg -y \
            -f lavfi -i "color=c=0x080D1A:s=1080x1920:r=30:d=30" \
            -i "$AUDIO_FILE" \
            -filter_complex "[0:v]drawbox=x=0:y=0:w=1080:h=1920:color=0x101B35@0.8:t=fill,drawbox=x=40:y=250:w=1000:h=1420:color=0x2563EB@0.10:t=fill,drawbox=x=40:y=250:w=1000:h=1420:color=0xD4AF37@0.7:t=8,subtitles=puzzle.ass[v]" \
            -map "[v]" -map 1:a \
            -af "apad,atrim=0:30" \
            -t 30 \
            -c:v libx264 -preset medium -crf 20 \
            -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            -movflags +faststart \
            puzzle-video.mp4

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          
