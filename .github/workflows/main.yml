
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Video puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة الصحيحة"
      question_audio:
        description: Question audio file
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio file
        required: true
        default: "answer.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            blender \
            fonts-dejavu-core \
            fonts-noto-core \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            libgles2 \
            libgbm1 \
            xvfb \
            xauth
          pip install pillow

      - name: Validate Files
        run: |
          set -e
          test -s "${{ inputs.question_audio }}"
          test -s "${{ inputs.answer_audio }}"
          ffprobe -v error "${{ inputs.question_audio }}"
          ffprobe -v error "${{ inputs.answer_audio }}"

      - name: Generate Animated 3D Environment
        run: |
          set -e
          mkdir -p /tmp/3d_frames

          cat > scene.py <<'PY'
          import bpy, math
          from mathutils import Vector

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          scene = bpy.context.scene
          scene.render.engine = 'BLENDER_EEVEE'

          # Blender 5 compatible settings
          scene.render.resolution_x = 720
          scene.render.resolution_y = 1280
          scene.render.resolution_percentage = 100
          scene.render.fps = 30
          scene.frame_start = 1
          scene.frame_end = 180

          scene.render.image_settings.file_format = 'PNG'
          scene.render.image_settings.color_mode = 'RGB'
          scene.render.film_transparent = False

          world = bpy.data.worlds.new("PuzzleWorld")
          scene.world = world
          world.use_nodes = True
          world.node_tree.nodes["Background"].inputs["Color"].default_value = (0.005, 0.008, 0.025, 1)
          world.node_tree.nodes["Background"].inputs["Strength"].default_value = 0.5

          def mat(name, color, metallic=0, rough=0.3, emission=0):
              m = bpy.data.materials.new(name)
              m.diffuse_color = (*color, 1)
              m.use_nodes = True
              bs = m.node_tree.nodes.get("Principled BSDF")
              bs.inputs["Base Color"].default_value = (*color, 1)
              bs.inputs["Metallic"].default_value = metallic
              bs.inputs["Roughness"].default_value = rough
              bs.inputs["Emission Color"].default_value = (*color, 1)
              bs.inputs["Emission Strength"].default_value = emission
              return m

          blue = mat("Electric Blue", (0.015, 0.06, 0.3), 0.8, 0.2, 0.3)
          cyan = mat("Cyan Neon", (0.02, 0.5, 0.9), 0.4, 0.2, 2)
          gold = mat("Royal Gold", (0.8, 0.45, 0.08), 0.8, 0.2, 0.5)
          black = mat("Midnight Metal", (0.015, 0.02, 0.04), 0.7, 0.25)
          violet = mat("Violet", (0.12, 0.025, 0.3), 0.5, 0.2, 1)

          def cube(loc, scale, material, bevel=0.12):
              bpy.ops.mesh.primitive_cube_add(size=1, location=loc)
              o = bpy.context.object
              o.dimensions = scale
              bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)
              o.data.materials.append(material)
              if bevel:
                  b = o.modifiers.new("Edge bevel", "BEVEL")
                  b.width = bevel
                  b.segments = 3
                  o.modifiers.new("Weighted normals", "WEIGHTED_NORMAL")
              return o

          def cylinder(loc, radius, depth, material):
              bpy.ops.mesh.primitive_cylinder_add(
                  vertices=64,
                  radius=radius,
                  depth=depth,
                  location=loc
              )
              o = bpy.context.object
              o.data.materials.append(material)
              b = o.modifiers.new("Bevel", "BEVEL")
              b.width = 0.08
              b.segments = 3
              o.modifiers.new("Weighted normals", "WEIGHTED_NORMAL")
              return o

          def torus(loc, major, minor, material, rotation=(0,0,0)):
              bpy.ops.mesh.primitive_torus_add(
                  major_radius=major,
                  minor_radius=minor,
                  location=loc,
                  rotation=rotation,
                  major_segments=48,
                  minor_segments=12
              )
              o = bpy.context.object
              o.data.materials.append(material)
              bpy.ops.object.shade_smooth()
              return o

          def sphere(loc, radius, material):
              bpy.ops.mesh.primitive_uv_sphere_add(
                  segments=24,
                  ring_count=12,
                  radius=radius,
                  location=loc
              )
              o = bpy.context.object
              o.data.materials.append(material)
              bpy.ops.object.shade_smooth()
              return o

          # Main floor
          cube((0,0,-0.5),(30,30,1),black,0.2)

          # Floor light strips
          for x in range(-12,13,3):
              cube((x,0,0.02),(0.025,24,0.03),blue,0.01)

          for y in range(-12,13,3):
              cube((0,y,0.02),(24,0.025,0.03),blue,0.01)

          # Main stage
          cylinder((0,4,0.3),5.5,0.6,black)
          cylinder((0,4,0.65),5.1,0.25,gold)
          cylinder((0,4,0.85),4.8,0.2,blue)
          cylinder((0,4,1.0),4.5,0.15,black)

          torus((0,4,1.12),4.5,0.08,cyan)
          torus((0,4,0.5),5.2,0.12,gold)

          # Vertical architectural frame
          cube((-5,4,7),(0.5,0.5,12),gold,0.12)
          cube((5,4,7),(0.5,0.5,12),gold,0.12)
          cube((0,4,13),(10.5,0.5,0.5),gold,0.12)

          cube((-4.6,4,7),(0.12,0.15,11),cyan,0.04)
          cube((4.6,4,7),(0.12,0.15,11),cyan,0.04)

          # Decorative rings
          ring1 = torus((0,4,9),4.3,0.08,cyan)
          ring2 = torus((0,4,9),3.7,0.06,gold)

          # Floating decorative objects
          objects = []

          for i in range(8):
              angle = i * math.pi / 4
              x = math.cos(angle) * 7
              y = 3 + math.sin(angle) * 4
              z = 3 + (i % 3) * 2

              if i % 3 == 0:
                  o = sphere((x,y,z),0.6,cyan)
              elif i % 3 == 1:
                  o = cube((x,y,z),(1,1,1),gold,0.15)
              else:
                  o = torus((x,y,z),0.7,0.12,violet)

              objects.append(o)

          # Animation
          for o in objects:
              start = o.location.z
              o.keyframe_insert(data_path="location",frame=1)
              o.location.z = start + 0.6
              o.keyframe_insert(data_path="location",frame=90)
              o.location.z = start
              o.keyframe_insert(data_path="location",frame=180)

              o.rotation_euler[2] = 0
              o.keyframe_insert(data_path="rotation_euler",frame=1)
              o.rotation_euler[2] = math.pi
              o.keyframe_insert(data_path="rotation_euler",frame=180)

          for r in (ring1,ring2):
              r.rotation_euler[2] = 0
              r.keyframe_insert(data_path="rotation_euler",frame=1)
              r.rotation_euler[2] = math.pi*2
              r.keyframe_insert(data_path="rotation_euler",frame=180)

          # Lights
          def light(name,loc,power,color,size):
              bpy.ops.object.light_add(type='AREA',location=loc)
              l=bpy.context.object
              l.name=name
              l.data.energy=power
              l.data.color=color
              l.data.shape='DISK'
              l.data.size=size
              l.rotation_euler=(Vector((0,4,5))-l.location).to_track_quat('-Z','Y').to_euler()

          light("Blue Key",(-8,-5,12),1600,(0.1,0.3,1),8)
          light("Gold Rim",(8,5,12),1800,(1,0.55,0.1),7)
          light("Cyan Fill",(0,10,10),1200,(0.1,0.8,1),6)

          # Camera
          bpy.ops.object.camera_add(location=(0,-19,9))
          cam=bpy.context.object
          cam.rotation_euler=(Vector((0,4,6))-cam.location).to_track_quat('-Z','Y').to_euler()
          cam.data.lens=35
          scene.camera=cam

          cam.location.x=-0.5
          cam.keyframe_insert(data_path="location",frame=1)
          cam.location.x=0.5
          cam.keyframe_insert(data_path="location",frame=180)

          scene.view_settings.view_transform='AgX'
          scene.render.filepath='/tmp/3d_frames/frame_'

          bpy.ops.render.render(animation=True)
          PY

          LIBGL_ALWAYS_SOFTWARE=1 \
          MESA_LOADER_DRIVER_OVERRIDE=llvmpipe \
          EGL_PLATFORM=surfaceless \
          xvfb-run -a blender -b -t 2 --python scene.py

          test -f /tmp/3d_frames/frame_0001.png

          ffmpeg -nostdin -y \
            -framerate 30 \
            -i /tmp/3d_frames/frame_%04d.png \
            -vf "scale=1080:1920" \
            -c:v libx264 \
            -preset ultrafast \
            -crf 22 \
            -pix_fmt yuv420p \
            /tmp/3d_background.mp4

          test -s /tmp/3d_background.mp4

      - name: Generate Graphics
        run: |
          set -e

          cat > graphics.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          W,H=1080,1920
          os.makedirs("graphics",exist_ok=True)

          font_path="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          def font(size):
              return ImageFont.truetype(font_path,size)

          def make(name,text,size=72,color=(255,255,255)):
              im=Image.new("RGBA",(W,H),(0,0,0,0))
              d=ImageDraw.Draw(im)

              d.rounded_rectangle(
                  (65,380,1015,1510),
                  radius=70,
                  fill=(5,12,35,225),
                  outline=(0,190,255,255),
                  width=10
              )

              d.rounded_rectangle(
                  (90,405,990,1485),
                  radius=55,
                  outline=(255,190,45,230),
                  width=5
              )

              for x in (120,960):
                  for y in (440,1450):
                      d.ellipse((x-12,y-12,x+12,y+12),fill=(255,210,70,255))

              lines=text.split("\n")
              spacing=35
              heights=[]

              for line in lines:
                  box=d.textbbox((0,0),line,font=font(size),direction="rtl")
                  heights.append(box[3]-box[1])

              total=sum(heights)+spacing*(len(lines)-1)
              y=(H-total)//2

              for line,h in zip(lines,heights):
                  d.text(
                      (W//2,y),
                      line,
                      font=font(size),
                      fill=color,
                      anchor="mt",
                      direction="rtl",
                      language="ar",
                      stroke_width=3,
                      stroke_fill=(0,0,0,200)
                  )
                  y+=h+spacing

              im.save("graphics/"+name+".png")

          make("intro","اختبر ذكاءك",100,(255,210,60))
          make("question",os.environ["QUESTION"],70)
          make("answer",os.environ["ANSWER"],75,(255,210,60))
          make("outro","هل استطعت الحل؟\nتابعنا للمزيد",65,(0,220,255))

          for n in range(7,0,-1):
              make("timer"+str(n),str(n),220,(255,210,40))
          PY

          QUESTION="${{ inputs.question }}" \
          ANSWER="${{ inputs.answer }}" \
          python graphics.py

      - name: Render Video Segments
        shell: bash
        run: |
          set -e

          mkdir -p segments

          Q_AUDIO="${{ inputs.question_audio }}"
          A_AUDIO="${{ inputs.answer_audio }}"

          qdur=$(ffprobe -v error \
            -show_entries format=duration \
            -of csv=p=0 "$Q_AUDIO")

          adur=$(ffprobe -v error \
            -show_entries format=duration \
            -of csv=p=0 "$A_AUDIO")

          render() {
            IMAGE="$1"
            DURATION="$2"
            AUDIO="$3"
            OUTPUT="$4"

            if [ -n "$AUDIO" ]; then
              AUDIO_INPUT=(-i "$AUDIO")
            else
              AUDIO_INPUT=(-f lavfi -i "anullsrc=r=44100:cl=stereo")
            fi

            ffmpeg -nostdin -y \
              -stream_loop -1 -i /tmp/3d_background.mp4 \
              -loop 1 -framerate 30 -i "$IMAGE" \
              "${AUDIO_INPUT[@]}" \
              -t "$DURATION" \
              -filter_complex \
              "[0:v]scale=1080:1920,format=rgba[bg];[1:v]format=rgba[fg];[bg][fg]overlay=0:0:format=auto,format=yuv420p[v]" \
              -map "[v]" \
              -map 2:a \
              -c:v libx264 \
              -preset ultrafast \
              -crf 22 \
              -c:a aac \
              -b:a 192k \
              -ar 44100 \
              -ac 2 \
              -pix_fmt yuv420p \
              "$OUTPUT"
          }

          render graphics/intro.png 2 "" segments/00.mp4

          render graphics/question.png \
            "$qdur" "$Q_AUDIO" segments/01.mp4

          i=2

          for n in 7 6 5 4 3 2 1; do
            render \
              "graphics/timer${n}.png" \
              1 \
              "" \
              "segments/$(printf '%02d' "$i").mp4"

            i=$((i+1))
          done

          render graphics/answer.png \
            "$adur" "$A_AUDIO" segments/09.mp4

          render graphics/outro.png 3 "" segments/10.mp4

      - name: Merge Video
        run: |
          set -e

          rm -f concat.txt

          for f in segments/*.mp4; do
            echo "file '$f'" >> concat.txt
          done

          ffmpeg -nostdin -y \
            -f concat \
            -safe 0 \
            -i concat.txt \
            -c copy \
            final_video.mp4

          ffprobe -v error \
            -show_entries format=duration \
            final_video.mp4

          test -s final_video.mp4

      - name: Verify Final Video
        run: |
          set -e
          test -s final_video.mp4

          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 \
            final_video.mp4

          ls -lh final_video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: final_video.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          
