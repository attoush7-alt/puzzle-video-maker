name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Video puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة الصحيحة"
      question_audio:
        description: Question audio filename in repository
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio filename in repository
        required: true
        default: "answer.wav"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg blender fonts-noto-core fonts-noto-extra fonts-dejavu-core xvfb libegl1 libgl1 libgl1-mesa-dri libgbm1
          python -m pip install --upgrade pip pillow

      - name: Validate audio
        env:
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          set -e
          test -f "$QA" || { echo "Question audio not found: $QA"; exit 1; }
          test -f "$AA" || { echo "Answer audio not found: $AA"; exit 1; }
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$QA"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AA"

      - name: Render looping 3D stage
        run: |
          cat > scene.py <<'PY'
          import bpy, math
          from mathutils import Vector

          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete(use_global=False)

          scene=bpy.context.scene

          # Blender 5.0.1 compatible engine
          scene.render.engine="BLENDER_EEVEE"

          scene.render.resolution_x=360
          scene.render.resolution_y=640
          scene.render.resolution_percentage=100
          scene.render.fps=24
          scene.frame_start=1
          scene.frame_end=24
          scene.render.image_settings.file_format="PNG"
          scene.render.filepath="/tmp/stage/frame_"
          scene.world.color=(0.025,0.025,0.04)

          def mat(name,color,metal=0,rough=.4):
              m=bpy.data.materials.new(name)
              m.diffuse_color=(*color,1)
              m.use_nodes=True
              bs=m.node_tree.nodes.get("Principled BSDF")
              bs.inputs["Base Color"].default_value=(*color,1)
              bs.inputs["Metallic"].default_value=metal
              bs.inputs["Roughness"].default_value=rough
              return m

          navy=mat("Midnight",(.018,.035,.12),.25)
          blue=mat("Electric blue",(.02,.25,.8),.55)
          gold=mat("Gold",(.95,.52,.06),.65,.25)
          white=mat("Pearl",(.85,.9,1),.15)
          pink=mat("Accent",(.7,.04,.35),.25)

          def cube(name,loc,scale,material):
              bpy.ops.mesh.primitive_cube_add(size=1,location=loc)
              o=bpy.context.object
              o.name=name
              o.dimensions=scale
              bpy.ops.object.transform_apply(
                  location=False,rotation=False,scale=True)
              o.data.materials.append(material)
              return o

          def sphere(name,loc,r,material):
              bpy.ops.mesh.primitive_uv_sphere_add(
                  segments=16,ring_count=8,radius=r,location=loc)
              o=bpy.context.object
              o.name=name
              o.data.materials.append(material)
              return o

          def torus(name,loc,major,minor,material):
              bpy.ops.mesh.primitive_torus_add(
                  major_radius=major,minor_radius=minor,location=loc)
              o=bpy.context.object
              o.name=name
              o.data.materials.append(material)
              return o

          # Stage
          cube("Stage floor",(0,0,-1.1),(12,12,.3),navy)

          bpy.ops.mesh.primitive_cylinder_add(
              vertices=48,radius=2.7,depth=.32,location=(0,0,-.7))
          platform=bpy.context.object
          platform.name="Hero platform"
          platform.data.materials.append(blue)

          torus("Platform gold rim",(0,0,-.48),2.65,.08,gold)
          torus("Platform neon ring",(0,0,-.4),2.35,.035,white)

          # Suspended rings
          for i in range(3):
              r=2.3+i*.35
              t=torus(
                  "Orbit ring "+str(i),
                  (0,0,1.4+i*.35),
                  r,.035,blue if i%2==0 else gold)
              t.rotation_euler[0]=math.radians(65+i*20)

          # Cartoon host
          sphere("Host body",(0,-.1,.5),.62,blue)
          sphere("Host head",(0,-.1,1.55),.78,white)
          sphere("Left ear",(-.42,-.1,2.25),.22,white)
          sphere("Right ear",(.42,-.1,2.25),.22,white)
          sphere("Left eye",(-.25,-.78,1.7),.12,navy)
          sphere("Right eye",(.25,-.78,1.7),.12,navy)
          sphere("Smile",(0,-.78,1.38),.12,pink)

          for x in [-.55,.55]:
              arm=sphere("Animated arm",(x,-.1,.65),.23,gold)
              arm.scale=(.55,.3,.25)
              arm.rotation_euler[1]=x*1.2

          for x in [-.25,.25]:
              cube("Host leg",(x,-.05,-.1),(.25,.35,.65),white)

          # Floating puzzle objects
          props=[]
          for i in range(8):
              angle=i*math.pi/4
              x=3.2*math.cos(angle)
              y=2.5*math.sin(angle)

              if i%2:
                  o=sphere(
                      "Floating orb "+str(i),
                      (x,y,1.5+(i%3)*.4),
                      .22,gold if i%3==0 else blue)
              else:
                  o=cube(
                      "Floating cube "+str(i),
                      (x,y,1.5+(i%3)*.4),
                      (.42,.42,.42),pink if i%3==0 else white)

              props.append(o)

          q=sphere("Question mark sphere",(0,0,3.3),.38,gold)
          q.scale=(.75,.75,.75)

          # Lights
          def area(name,loc,power,color,size):
              bpy.ops.object.light_add(type="AREA",location=loc)
              l=bpy.context.object
              l.name=name
              l.data.energy=power
              l.data.color=color
              l.data.shape="DISK"
              l.data.size=size
              l.rotation_euler=(
                  Vector((0,0,0))-l.location
              ).to_track_quat("-Z","Y").to_euler()

          area("Key light",(3,-5,6),900,(.35,.55,1),5)
          area("Gold rim",(-4,3,4),1000,(1,.5,.15),4)
          area("Fill",(0,4,5),650,(.2,.4,1),5)

          # Camera
          bpy.ops.object.camera_add(location=(6,-10,5))
          cam=bpy.context.object
          cam.rotation_euler=(
              Vector((0,0,1))-cam.location
          ).to_track_quat("-Z","Y").to_euler()
          cam.data.lens=42
          scene.camera=cam

          # Animation loop
          for frame in range(1,25):
              phase=2*math.pi*(frame-1)/24

              cam.location=(
                  6+0.22*math.sin(phase),
                  -10,
                  5+0.12*math.cos(phase)
              )
              cam.rotation_euler=(
                  Vector((0,0,1))-cam.location
              ).to_track_quat("-Z","Y").to_euler()

              cam.keyframe_insert(data_path="location",frame=frame)
              cam.keyframe_insert(data_path="rotation_euler",frame=frame)

              for i,o in enumerate(props):
                  o.location.z=1.5+(i%3)*.4+.18*math.sin(phase+i)
                  o.rotation_euler[2]=phase*(1 if i%2 else -1)
                  o.keyframe_insert(data_path="location",frame=frame)
                  o.keyframe_insert(data_path="rotation_euler",frame=frame)

              q.location.z=3.3+.15*math.sin(phase)
              q.keyframe_insert(data_path="location",frame=frame)

          for obj in scene.objects:
              if obj.animation_data and obj.animation_data.action:
                  for fc in obj.animation_data.action.fcurves:
                      for kp in fc.keyframe_points:
                          kp.interpolation="LINEAR"
                      fc.modifiers.new("CYCLES")

          bpy.ops.wm.save_as_mainfile(filepath="/tmp/stage.blend")
          PY

          mkdir -p /tmp/stage

          LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe EGL_PLATFORM=surfaceless xvfb-run -a blender -b -t 2 --python scene.py

          LIBGL_ALWAYS_SOFTWARE=1 MESA_LOADER_DRIVER_OVERRIDE=llvmpipe EGL_PLATFORM=surfaceless xvfb-run -a blender -b /tmp/stage.blend -t 2 -o /tmp/stage/frame_ -F PNG -a

          ffmpeg -y -framerate 24 -i /tmp/stage/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -t 1 /tmp/bg.mp4

      - name: Create text cards and assemble video
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          cat > graphics.py <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont

          W,H=720,1280
          os.makedirs("/tmp/cards",exist_ok=True)

          fontpaths=[
            "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf",
            "/usr/share/fonts/truetype/noto/NotoNaskhArabic-Regular.ttf",
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          ]

          def font(size):
              for p in fontpaths:
                  if os.path.exists(p):
                      return ImageFont.truetype(p,size)
              return ImageFont.load_default()

          def card(filename,heading,body="",number=None):
              im=Image.new("RGBA",(W,H),(0,0,0,0))
              d=ImageDraw.Draw(im)

              d.rounded_rectangle(
                  (42,250,678,1030),
                  radius=45,
                  fill=(8,15,48,225),
                  outline=(245,180,45,255),
                  width=5
              )

              d.rounded_rectangle(
                  (64,272,656,1008),
                  radius=36,
                  outline=(35,155,255,255),
                  width=3
              )

              d.text(
                  (W//2,350),
                  heading,
                  font=font(54),
                  fill=(255,208,85,255),
                  anchor="mm",
                  stroke_width=2,
                  stroke_fill=(30,30,65,255)
              )

              if body:
                  d.multiline_text(
                      (W//2,590),
                      body,
                      font=font(48),
                      fill=(255,255,255,255),
                      anchor="mm",
                      align="center",
                      spacing=20,
                      stroke_width=1,
                      stroke_fill=(0,0,0,255)
                  )

              if number is not None:
                  d.ellipse(
                      (220,750,500,1030),
                      fill=(255,175,30,255),
                      outline=(255,255,255,255),
                      width=6
                  )
                  d.text(
                      (360,890),
                      str(number),
                      font=font(170),
                      fill=(8,15,48,255),
                      anchor="mm"
                  )

              im.save("/tmp/cards/"+filename+".png")

          card("intro","لغز جديد","استعد للتحدي!")
          card("question","فكّر جيدًا",os.environ["QUESTION"])
          card("answer","الحل هو",os.environ["ANSWER"])
          card("pause","هل عرفت الإجابة؟","")
          card("outro","أحسنت!","تابع التحديات القادمة")

          for n in range(1,8):
              card("timer"+str(n),"فكّر جيدًا",os.environ["QUESTION"],n)
          PY

          python graphics.py

          mkdir -p /tmp/segments

          qdur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$QA")
          adur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$AA")

          make_segment() {
            name="$1"
            overlay="$2"
            duration="$3"
            audio="${4:-}"

            if [ -n "$audio" ]; then
              ffmpeg -y -stream_loop -1 -i /tmp/bg.mp4 -loop 1 -i "$overlay" -i "$audio" \
                -filter_complex "[0:v]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280[v0];[v0][1:v]overlay=0:0:format=auto,format=yuv420p[v]" \
                -map "[v]" -map 2:a -t "$duration" -r 24 \
                -c:v libx264 -preset ultrafast -crf 28 \
                -c:a aac -b:a 128k -shortest \
                "/tmp/segments/$name.mp4"
            else
              ffmpeg -y -stream_loop -1 -i /tmp/bg.mp4 -loop 1 -i "$overlay" \
                -filter_complex "[0:v]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280[v0];[v0][1:v]overlay=0:0:format=auto,format=yuv420p[v]" \
                -map "[v]" -t "$duration" -r 24 \
                -c:v libx264 -preset ultrafast -crf 28 -an \
                "/tmp/segments/$name.mp4"
            fi
          }

          make_segment intro /tmp/cards/intro.png 3
          make_segment question /tmp/cards/question.png "$qdur" "$QA"

          for n in 7 6 5 4 3 2 1; do
            make_segment "timer$n" "/tmp/cards/timer$n.png" 1
          done

          make_segment pause /tmp/cards/pause.png 1.2
          make_segment answer /tmp/cards/answer.png "$adur" "$AA"
          make_segment outro /tmp/cards/outro.png 3

          cd /tmp/segments

          for f in intro question timer7 timer6 timer5 timer4 timer3 timer2 timer1 pause answer outro; do
            echo "file '$f.mp4'" >> concat.txt
          done

          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy /tmp/puzzle-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: /tmp/puzzle-video.mp4
          retention-days: 7
