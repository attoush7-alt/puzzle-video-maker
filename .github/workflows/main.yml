name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة الصحيحة"
      audio_file:
        description: Audio file path
        required: true
        default: "audio.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Check audio file
        run: |
          test -f "${{ inputs.audio_file }}" || {
            echo "Audio file not found"
            exit 1
          }

      - name: Create video
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          python3 - <<'PY'
          import os

          title = os.environ["TITLE"]
          question = os.environ["QUESTION"]
          answer = os.environ["ANSWER"]

          def ass_escape(text):
              return text.replace("\\", "\\\\").replace("{", "\\{").replace("}", "\\}")

          with open("puzzle.ass", "w", encoding="utf-8") as f:
              f.write("""[Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          WrapStyle: 2

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Main,Noto Naskh Arabic,65,&H00FFFFFF,&H000000FF,&H00000000,&H80000000,1,0,0,0,100,100,0,0,1,3,1,5,60,60,60,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          """)
              f.write("Dialogue: 0,0:00:00.00,0:00:04.00,Main,,0,0,0,," + ass_escape(title) + "\\n")
              f.write("Dialogue: 0,0:00:04.00,0:00:22.00,Main,,0,0,0,," + ass_escape(question) + "\\n")
              f.write("Dialogue: 0,0:00:22.00,0:00:30.00,Main,,0,0,0,," + ass_escape(answer) + "\\n")
          PY

          ffmpeg -y \
            -f lavfi -i "color=c=0x172554:s=1080x1920:r=30:d=30" \
            -i "${{ inputs.audio_file }}" \
            -vf "subtitles=puzzle.ass" \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -shortest \
            puzzle-video.mp4

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
