
name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer and explanation
        required: true
        default: "الإجابة الصحيحة"
      question_audio:
        description: Question audio file
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio file
        required: true
        default: "answer.wav"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          python3 -m pip install --break-system-packages Pillow

      - name: Check audio
        env:
          Q_AUDIO: ${{ inputs.question_audio }}
          A_AUDIO: ${{ inputs.answer_audio }}
        run: |
          test -f "$Q_AUDIO"
          test -f "$A_AUDIO"

      - name: Generate graphics
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1080, 1920
          FONT = "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf"
          GOLD = (255, 195, 55)
          BLUE = (0, 210, 255)
          WHITE = (255, 255, 255)

          def f(size):
              return ImageFont.truetype(FONT, size)

          def bg():
              im = Image.new("RGB", (W, H))
              p = im.load()
              for y in range(H):
                  for x in range(W):
                      glow = max(0, 1 - abs(x-W//2)/(W*0.8))
                      p[x,y] = (
                          int(4+8*glow),
                          int(8+18*glow),
                          int(22+55*glow)
                      )
              return im

          def wrap(text, font, width):
              words = text.split()
              lines = []
              line = ""
              for word in words:
                  test = (line+" "+word).strip()
                  box = font.getbbox(test, direction="rtl")
                  if box[2]-box[0] > width and line:
                      lines.append(line)
                      line = word
                  else:
                      line = test
              if line:
                  lines.append(line)
              return lines

          def centered(draw, text, font, y, color, width=850):
              lines = wrap(text, font, width)
              line_h = font.size+30
              total = len(lines)*line_h
              y -= total//2
              for line in lines:
                  box = draw.textbbox(
                      (0,0),line,font=font,direction="rtl"
                  )
                  tw = box[2]-box[0]
                  draw.text(
                      ((W-tw)//2,y),line,font=font,
                      fill=color,direction="rtl",
                      stroke_width=2,stroke_fill=(4,10,25)
                  )
                  y += line_h

          def make(label,text,file,number=None):
              im = bg()
              d = ImageDraw.Draw(im)

              d.rounded_rectangle(
                  (35,35,W-35,H-35),
                  radius=55,outline=(20,50,100),width=18
              )
              d.rounded_rectangle(
                  (55,55,W-55,H-55),
                  radius=45,outline=GOLD,width=5
              )

              d.rounded_rectangle(
                  (150,220,930,390),
                  radius=55,fill=(12,28,65),
                  outline=GOLD,width=5
              )
              centered(d,label,f(60),305,GOLD,700)

              if number is not None:
                  d.ellipse(
                      (170,580,910,1320),
                      outline=(12,60,130),width=28
                  )
                  d.ellipse(
                      (220,630,860,1270),
                      outline=BLUE,width=12
                  )
                  centered(d,str(number),f(350),950,WHITE,600)
              else:
                  centered(d,text,f(90),960,WHITE,850)

              d.rounded_rectangle(
                  (170,1480,910,1620),
                  radius=50,fill=(10,35,85),
                  outline=BLUE,width=5
              )
              centered(d,"اختبر ذكاءك",f(55),1550,GOLD,700)

              im.save(file)

          make("تحدي الذكاء",os.environ["TITLE"],"intro.png")
          make("السؤال",os.environ["QUESTION"],"question.png")
          make("الإجابة",os.environ["ANSWER"],"answer.png")
          make("شاركنا رأيك","اكتب إجابتك في التعليقات","outro.png")

          for n in range(7,0,-1):
              make("فكر قبل الإجابة","",f"timer{n}.png",n)
          PY

      - name: Render video segments
        env:
          Q_AUDIO: ${{ inputs.question_audio }}
          A_AUDIO: ${{ inputs.answer_audio }}
        run: |
          mkdir -p segments
          : > concat.txt

          qdur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$Q_AUDIO")
          adur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$A_AUDIO")

          render_silent() {
            image="$1"
            duration="$2"
            output="$3"

            ffmpeg -nostdin -y \
              -loop 1 -i "$image" \
              -f lavfi -i anullsrc=r=44100:cl=stereo \
              -t "$duration" \
              -vf "zoompan=z='min(zoom+0.0007,1.07)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30" \
              -map 0:v -map 1:a \
              -c:v libx264 -preset ultrafast -crf 23 \
              -pix_fmt yuv420p -c:a aac -b:a 128k \
              "$output"
          }

          render_audio() {
            image="$1"
            audio="$2"
            duration="$3"
            output="$4"

            ffmpeg -nostdin -y \
              -loop 1 -i "$image" \
              -i "$audio" \
              -t "$duration" \
              -vf "zoompan=z='min(zoom+0.0007,1.07)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30" \
              -map 0:v -map 1:a \
              -c:v libx264 -preset ultrafast -crf 23 \
              -pix_fmt yuv420p -c:a aac -b:a 192k \
              "$output"
          }

          render_silent intro.png 2 segments/00.mp4

          render_audio question.png "$Q_AUDIO" "$qdur" segments/01.mp4

          i=2
          for n in 7 6 5 4 3 2 1; do
            render_silent "timer${n}.png" 1 "segments/$(printf '%02d' $i).mp4"
            i=$((i+1))
          done

          render_audio answer.png "$A_AUDIO" "$adur" segments/09.mp4

          render_silent outro.png 3 segments/10.mp4

          for f in segments/*.mp4; do
            echo "file '$f'" >> concat.txt
          done

          ffmpeg -nostdin -y \
            -f concat -safe 0 -i concat.txt \
            -c copy combined.mp4

      - name: Final video
        run: |
          ffmpeg -nostdin -y \
            -i combined.mp4 \
            -c copy -movflags +faststart \
            puzzle-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          
