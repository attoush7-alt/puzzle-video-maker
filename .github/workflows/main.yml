name: Create Puzzle Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: Video title
        required: true
        default: "اختبر ذكاءك"
      question:
        description: Video puzzle question
        required: true
        default: "هل تستطيع حل هذا اللغز؟"
      answer:
        description: Correct answer
        required: true
        default: "الإجابة هي ..."
      question_audio:
        description: Question audio file
        required: true
        default: "question.wav"
      answer_audio:
        description: Answer audio file
        required: true
        default: "answer.wav"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg xvfb python3-pil fonts-dejavu-core fonts-noto-core
          python3 -m pip install --break-system-packages pillow arabic-reshaper python-bidi

      - name: Validate audio
        env:
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          set -e
          test -f "$QA"
          test -f "$AA"
          ffprobe -v error "$QA"
          ffprobe -v error "$AA"

      - name: Build 3D Quiz Studio
        run: |
          cat > scene.py <<'PY'
          import bpy
          import math
          from mathutils import Vector

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          s = bpy.context.scene
          try:
              s.render.engine = 'BLENDER_EEVEE_NEXT'
          except:
              s.render.engine = 'BLENDER_EEVEE'

          s.render.resolution_x = 720
          s.render.resolution_y = 1280
          s.render.resolution_percentage = 100
          s.render.image_settings.file_format = 'PNG'
          s.render.film_transparent = False

          s.render.engine = s.render.engine
          s.render.filepath = '/tmp/stage.png'

          s.world.color = (0.015, 0.015, 0.03)

          # Materials
          def mat(name, color, metal=0, rough=.35, emission=0):
              m = bpy.data.materials.new(name)
              m.diffuse_color = (*color, 1)
              m.use_nodes = True
              b = m.node_tree.nodes.get('Principled BSDF')
              b.inputs['Base Color'].default_value = (*color, 1)
              b.inputs['Metallic'].default_value = metal
              b.inputs['Roughness'].default_value = rough
              if emission:
                  b.inputs['Emission Color'].default_value = (*color, 1)
                  b.inputs['Emission Strength'].default_value = emission
              return m

          navy = mat('Deep navy', (.012,.025,.09), .35,.3)
          blue = mat('Royal blue', (.025,.12,.4), .45,.25)
          steel = mat('Metallic steel', (.12,.2,.38), .7,.25)
          cyan = mat('Electric cyan', (.025,.5,1), .35,.2,2.5)
          gold = mat('Premium gold', (1,.55,.08), .7,.2,1.2)
          purple = mat('Violet', (.22,.06,.48), .5,.25)
          white = mat('White', (.8,.9,1), .1,.25,1)

          def cube(name,pos,scale,ma,bevel=.08):
              bpy.ops.mesh.primitive_cube_add(size=1,location=pos)
              o = bpy.context.object
              o.name = name
              o.dimensions = scale
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              o.data.materials.append(ma)
              if bevel:
                  b = o.modifiers.new('Rounded edges','BEVEL')
                  b.width = bevel
                  b.segments = 5
                  o.modifiers.new('Weighted normals','WEIGHTED_NORMAL')
              return o

          def sphere(name,pos,scale,ma):
              bpy.ops.mesh.primitive_uv_sphere_add(
                  segments=32,ring_count=20,location=pos)
              o = bpy.context.object
              o.name = name
              o.scale = scale
              o.data.materials.append(ma)
              bpy.ops.object.shade_smooth()
              return o

          def cylinder(name,pos,radius,depth,ma):
              bpy.ops.mesh.primitive_cylinder_add(
                  vertices=96,radius=radius,depth=depth,location=pos)
              o = bpy.context.object
              o.name = name
              o.data.materials.append(ma)
              b = o.modifiers.new('Edge bevel','BEVEL')
              b.width = .1
              b.segments = 4
              o.modifiers.new('Weighted normals','WEIGHTED_NORMAL')
              return o

          def torus(name,pos,r,ma,rot=(0,0,0),minor=.05):
              bpy.ops.mesh.primitive_torus_add(
                  major_radius=r,minor_radius=minor,
                  location=pos,rotation=rot,
                  major_segments=80,minor_segments=16)
              o = bpy.context.object
              o.name = name
              o.data.materials.append(ma)
              bpy.ops.object.shade_smooth()
              return o

          # Floor
          cube('Studio floor',(0,0,-1),(200,200,.2),navy)

          # Rear wall
          cube('Studio wall',(0,5,5),(18,.4,14),navy)

          # Architectural panels
          for x in [-5,-3.8,3.8,5]:
              cube('Wall strip',(x,4.65,4),(.14,.2,8),steel,.05)
              sphere('Neon light',(x,4.4,6.5),(.14,.14,.14),cyan)

          # Central architectural frame
          cube('Top frame',(0,2.8,7),(7,.35,.3),gold)
          cube('Left frame',(-3.5,2.8,4.2),(.3,.35,5.6),cyan)
          cube('Right frame',(3.5,2.8,4.2),(.3,.35,5.6),cyan)

          # Central platform
          cylinder('Main platform',(0,0,-.45),3.5,.65,steel)
          cylinder('Platform top',(0,0,-.1),3.25,.18,blue)
          torus('Main neon ring',(0,0,-.05),3.35,cyan)
          torus('Lower gold ring',(0,0,-.75),3.4,gold)

          # Side pillars
          for x in [-4,4]:
              cylinder('Pillar base',(x,0,.1),.65,.35,gold)
              cylinder('Pillar body',(x,0,1.6),.38,2.8,steel)
              sphere('Pillar cap',(x,0,3.2),(.5,.5,.5),gold)
              torus('Pillar neon',(x,0,1.5),.55,cyan)

          # Floating geometric decorations
          sphere('Blue orb',(-2.7,1.5,2.8),(.5,.5,.5),cyan)
          sphere('Gold orb',(2.8,1.5,3),(.4,.4,.4),gold)

          cube('Floating cube',(-2.6,-1.3,2.5),(.8,.8,.8),purple)
          cube('Small cube',(2.7,-1.2,2.5),(.6,.6,.6),gold)

          torus('Floating ring',(2.5,-1.5,4),.7,gold,(.8,.2,.3))
          torus('Floating blue ring',(-2.5,-1.5,4),.65,cyan,(.4,.5,.2))

          # Decorative stars
          for i in range(18):
              x = ((i*37)%100)/100*9-4.5
              z = ((i*61)%100)/100*8+1
              sphere('Star',(x,4.2,z),(.045,.045,.045),white)

          # Camera
          bpy.ops.object.camera_add(location=(0,-17,7))
          cam = bpy.context.object
          cam.rotation_euler = (
              Vector((0,0,2.8))-cam.location
          ).to_track_quat('-Z','Y').to_euler()
          cam.data.lens = 42
          s.camera = cam

          # Lighting
          def light(name,pos,power,color,size):
              bpy.ops.object.light_add(type='AREA',location=pos)
              l = bpy.context.object
              l.name = name
              l.data.energy = power
              l.data.color = color
              l.data.shape = 'DISK'
              l.data.size = size
              l.rotation_euler = (
                  Vector((0,0,0))-l.location
              ).to_track_quat('-Z','Y').to_euler()

          light('Key light',(4,-6,9),1800,(.35,.6,1),6)
          light('Fill light',(-5,-3,5),1500,(.2,.4,1),5)
          light('Gold rim',(0,4,7),2200,(1,.5,.15),5)
          light('Top light',(0,0,10),1600,(1,1,1),5)
          light('Front light',(0,-8,3),900,(.5,.7,1),4)

          s.render.filepath='/tmp/stage.png'
          bpy.ops.render.render(write_still=True)
          PY

          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python scene.py

      - name: Create Premium Graphics
        env:
          TITLE: ${{ inputs.title }}
          QUESTION: ${{ inputs.question }}
          ANSWER: ${{ inputs.answer }}
        run: |
          cat > graphics.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os
          import arabic_reshaper
          from bidi.algorithm import get_display

          W,H = 720,1280
          os.makedirs('graphics',exist_ok=True)

          FONT_PATH = '/usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf'

          def font(size):
              return ImageFont.truetype(FONT_PATH,size)

          def shape(text):
              return get_display(arabic_reshaper.reshape(str(text)))

          def wrap(text,f,max_width):
              words = str(text).split()
              lines = []
              current = ''
              for word in words:
                  test = word if not current else current+' '+word
                  if f.getlength(shape(test)) <= max_width:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word
              if current:
                  lines.append(current)
              return lines

          def fit(text,max_width,max_height,start=60,minimum=28):
              for size in range(start,minimum-1,-2):
                  f = font(size)
                  lines = wrap(text,f,max_width)
                  lh = int(size*1.45)
                  if len(lines)*lh <= max_height:
                      return f,lines,lh
              f = font(minimum)
              lines = wrap(text,f,max_width)
              return f,lines,int(minimum*1.45)

          def draw_center_lines(d,lines,f,lh,cy,fill=(255,255,255,255),stroke=2):
              total = len(lines)*lh
              y = cy-total/2
              for line in lines:
                  d.text(
                      (360,y+lh/2),
                      shape(line),
                      font=f,
                      fill=fill,
                      anchor='mm',
                      stroke_width=stroke,
                      stroke_fill=(5,15,40,255)
                  )
                  y += lh

          def rounded(d,box,r,fill,outline=None,width=1):
              d.rounded_rectangle(
                  box,radius=r,fill=fill,outline=outline,width=width)

          def base():
              im = Image.new('RGBA',(W,H),(0,0,0,0))
              d = ImageDraw.Draw(im)
              rounded(
                  d,(30,135,690,1145),48,
                  (5,12,35,238),(40,180,255,255),4
              )
              rounded(
                  d,(48,153,672,1127),40,
                  (12,25,65,210),(255,190,55,255),2
              )
              return im,d

          def header(d,text):
              rounded(
                  d,(75,185,645,315),32,
                  (20,55,130,255),(255,195,60,255),4
              )
              f,lines,lh = fit(text,480,95,54,32)
              draw_center_lines(
                  d,lines,f,lh,250,
                  (255,220,120,255),2
              )

          def question_panel(d,text,cy=520,height=300):
              rounded(
                  d,(75,360,645,360+height),38,
                  (10,30,80,255),(60,170,255,255),4
              )
              f,lines,lh = fit(text,470,height-65,66,32)
              draw_center_lines(
                  d,lines,f,lh,360+height/2,
                  (255,255,255,255),3
              )

          def footer(d,text):
              rounded(
                  d,(110,950,610,1055),30,
                  (15,40,100,255),(255,195,60,255),3
              )
              f,lines,lh = fit(text,420,80,36,22)
              draw_center_lines(
                  d,lines,f,lh,1002,
                  (255,220,120,255),2
              )

          def save(im,name):
              im.save('graphics/'+name+'.png')

          # Intro
          im,d = base()
          header(d,os.environ['TITLE'])
          question_panel(d,'استعد للتحدي!',520,260)
          footer(d,'اختبر قوة ذكائك')
          save(im,'intro')

          # Question
          im,d = base()
          header(d,'لغز اليوم')
          question_panel(d,os.environ['QUESTION'],550,380)
          footer(d,'فكر قبل أن تجيب')
          save(im,'question')

          # Countdown
          for n in range(7,0,-1):
              im,d = base()
              header(d,'فكر جيدًا')
              question_panel(d,os.environ['QUESTION'],480,300)

              rounded(
                  d,(230,800,490,1060),130,
                  (12,35,110,255),(255,195,60,255),10
              )
              d.text(
                  (360,930),str(n),
                  font=font(180),
                  fill=(255,255,255,255),
                  anchor='mm',
                  stroke_width=5,
                  stroke_fill=(10,20,60,255)
              )
              footer(d,'الوقت المتبقي')
              save(im,'timer'+str(n))

          # Pause
          im,d = base()
          header(d,'هل عرفت الحل؟')
          question_panel(d,os.environ['QUESTION'],550,380)
          footer(d,'استعد لكشف الإجابة')
          save(im,'pause')

          # Answer
          im,d = base()
          header(d,'الإجابة الصحيحة')
          rounded(
              d,(75,420,645,820),40,
              (45,30,10,255),(255,195,60,255),5
          )
          f,lines,lh = fit(os.environ['ANSWER'],470,300,70,32)
          draw_center_lines(
              d,lines,f,lh,620,
              (255,225,120,255),3
          )
          footer(d,'هل كانت إجابتك صحيحة؟')
          save(im,'answer')

          # Outro
          im,d = base()
          header(d,'أحسنت التفكير!')
          question_panel(d,'هل استطعت حل اللغز؟',520,280)
          footer(d,'تابع المزيد من الألغاز')
          save(im,'outro')
          PY

          python3 graphics.py

      - name: Render Video and Assemble
        env:
          QA: ${{ inputs.question_audio }}
          AA: ${{ inputs.answer_audio }}
        run: |
          set -e
          mkdir -p segments

          QD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$QA")
          AD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$AA")

          make_segment() {
            NAME="$1"
            OVER="$2"
            DUR="$3"
            AUD="$4"

            if [ "$AUD" = "silence" ]; then
              ffmpeg -y -loglevel error \
                -loop 1 -i /tmp/stage.png \
                -loop 1 -i "$OVER" \
                -f lavfi -i "anullsrc=r=44100:cl=stereo" \
                -filter_complex \
                "[0:v]scale=720:1280,zoompan=z='min(zoom+0.0004,1.08)':d=1:s=720x1280:fps=24,format=yuv420p[v0];[v0][1:v]overlay=0:0,format=yuv420p[v]" \
                -map "[v]" -map 2:a \
                -t "$DUR" -r 24 \
                -c:v libx264 -preset ultrafast -crf 23 \
                -c:a aac -b:a 128k -ar 44100 \
                -shortest "segments/$NAME.mp4"
            else
              ffmpeg -y -loglevel error \
                -loop 1 -i /tmp/stage.png \
                -loop 1 -i "$OVER" \
                -i "$AUD" \
                -filter_complex \
                "[0:v]scale=720:1280,zoompan=z='min(zoom+0.0004,1.08)':d=1:s=720x1280:fps=24,format=yuv420p[v0];[v0][1:v]overlay=0:0,format=yuv420p[v];[2:a]aresample=44100,aformat=channel_layouts=stereo[a]" \
                -map "[v]" -map "[a]" \
                -t "$DUR" -r 24 \
                -c:v libx264 -preset ultrafast -crf 23 \
                -c:a aac -b:a 128k -ar 44100 \
                "segments/$NAME.mp4"
            fi
          }

          # Intro
          make_segment intro graphics/intro.png 3 silence

          # Question and audio
          make_segment question graphics/question.png "$QD" "$QA"

          # Countdown
          for N in 7 6 5 4 3 2 1; do
            make_segment "timer$N" "graphics/timer$N.png" 1 silence
          done

          # Pause
          make_segment pause graphics/pause.png 1.5 silence

          # Answer
          make_segment answer graphics/answer.png "$AD" "$AA"

          # Outro
          make_segment outro graphics/outro.png 3 silence

          # Assembly order
          cat > concat.txt <<'EOF'
          file 'segments/intro.mp4'
          file 'segments/question.mp4'
          file 'segments/timer7.mp4'
          file 'segments/timer6.mp4'
          file 'segments/timer5.mp4'
          file 'segments/timer4.mp4'
          file 'segments/timer3.mp4'
          file 'segments/timer2.mp4'
          file 'segments/timer1.mp4'
          file 'segments/pause.mp4'
          file 'segments/answer.mp4'
          file 'segments/outro.mp4'
          EOF

          ffmpeg -y -loglevel error \
            -f concat -safe 0 -i concat.txt \
            -c:v libx264 -preset ultrafast -crf 23 \
            -c:a aac -b:a 128k \
            -pix_fmt yuv420p -movflags +faststart \
            puzzle-video.mp4

          # Verification
          ffprobe -v error -show_entries stream=codec_type \
            -of csv=p=0 puzzle-video.mp4 > streams.txt

          grep -q video streams.txt
          grep -q audio streams.txt

          echo "Video and audio verified."

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: puzzle-video
          path: puzzle-video.mp4
          retention-days: 7
