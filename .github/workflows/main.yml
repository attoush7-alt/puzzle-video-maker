name: Create Cat Video

on:
  workflow_dispatch:
    inputs:
      scenes_json:
        description: JSON array of 5 scenes with image_url and caption
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install pillow arabic-reshaper python-bidi

      - name: Validate scene data
        env:
          SCENES_JSON: ${{ inputs.scenes_json }}
        run: |
          python - <<'PY'
          import json, os

          scenes = json.loads(os.environ["SCENES_JSON"])

          if not isinstance(scenes, list) or len(scenes) != 5:
              raise SystemExit("Exactly 5 scenes are required.")

          for i, scene in enumerate(scenes, 1):
              if not isinstance(scene, dict):
                  raise SystemExit(f"Scene {i} is invalid.")

              url = scene.get("image_url", "")
              if not isinstance(url, str) or not url.startswith(("https://", "http://")):
                  raise SystemExit(f"Scene {i} has an invalid image URL.")

              caption = scene.get("caption", "")
              if not isinstance(caption, str):
                  raise SystemExit(f"Scene {i} caption must be text.")

          with open("scenes.json", "w", encoding="utf-8") as f:
              json.dump(scenes, f, ensure_ascii=False)
          PY

          mkdir -p images captions output

      - name: Download scene images
        run: |
          python - <<'PY'
          import json, urllib.request

          scenes = json.load(open("scenes.json", encoding="utf-8"))

          for i, scene in enumerate(scenes, 1):
              url = scene["image_url"]

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()

              if len(data) < 1000:
                  raise SystemExit(f"Image {i} is too small or invalid.")

              with open(f"images/{i}.jpg", "wb") as f:
                  f.write(data)

          print("All 5 images downloaded.")
          PY

      - name: Create Arabic captions
        run: |
          cat > caption.py <<'PY'
          import json
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display

          scenes = json.load(open("scenes.json", encoding="utf-8"))

          font_path = "/usr/share/fonts/truetype/noto/NotoSansArabic-Regular.ttf"

          for i, scene in enumerate(scenes, 1):
              im = Image.new("RGBA", (720, 1280), (0, 0, 0, 0))
              draw = ImageDraw.Draw(im)

              text = scene.get("caption", "").strip()

              if text:
                  text = get_display(arabic_reshaper.reshape(text))
                  font = ImageFont.truetype(font_path, 48)

                  max_width = 660
                  words = text.split()
                  lines = []
                  current = ""

                  for word in words:
                      test = (current + " " + word).strip()
                      bbox = draw.textbbox(
                          (0, 0), test, font=font, stroke_width=3
                      )

                      if bbox[2] - bbox[0] <= max_width:
                          current = test
                      else:
                          if current:
                              lines.append(current)
                          current = word

                  if current:
                      lines.append(current)

                  y = 950

                  for line in lines:
                      bbox = draw.textbbox(
                          (0, 0), line, font=font, stroke_width=3
                      )
                      width = bbox[2] - bbox[0]
                      x = (720 - width) // 2

                      draw.text(
                          (x, y),
                          line,
                          font=font,
                          fill="white",
                          stroke_width=4,
                          stroke_fill="black"
                      )

                      y += 65

              im.save(f"captions/{i}.png")

          print("Captions created.")
          PY

          python caption.py

      - name: Render 5 scenes
        run: |
          for i in 1 2 3 4 5; do

            ffmpeg -y \
              -loop 1 -i images/$i.jpg \
              -loop 1 -i captions/$i.png \
              -filter_complex \
              "[0:v]scale=900:1600:force_original_aspect_ratio=increase,crop=900:1600,zoompan=z='min(zoom+0.0015,1.12)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=125:s=720x1280:fps=25,setsar=1[v];[v][1:v]overlay=0:0,format=yuv420p[out]" \
              -map "[out]" \
              -t 5 \
              -r 25 \
              -c:v libx264 \
              -preset ultrafast \
              -pix_fmt yuv420p \
              output/scene$i.mp4

          done

      - name: Concatenate scenes
        run: |
          cd output

          for i in 1 2 3 4 5; do
            echo "file 'scene$i.mp4'" >> list.txt
          done

          ffmpeg -y \
            -f concat \
            -safe 0 \
            -i list.txt \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            -movflags +faststart \
            cat-video.mp4

      - name: Verify video
        run: |
          test -s output/cat-video.mp4

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/cat-video.mp4

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height \
            -of default=noprint_wrappers=1 \
            output/cat-video.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: cat-video
          path: output/cat-video.mp4
          retention-days: 3
          
